<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LES ENTRETIENS</title>
<meta name="theme-color" content="#11141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --paper:#f5f7f9; --card:#fff; --card2:#eef1f5; --ink:#161a21; --muted:#5c6474; --faint:#8b94a3;
    --line:#dce1e8; --line-soft:#e9edf2;
    --brick:#a8342a; --brick-soft:#f4e4e2;
    --canal:#245c69; --canal-soft:#e1eced;
    --gold:#8a5a10; --gold-soft:#f8eeda;
    --good:#1b7a4b; --good-soft:#e2f1e8;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --disp:"Bitter",Georgia,serif;
    --body:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0f1217; --card:#171b22; --card2:#1f242d; --ink:#e9edf3; --muted:#99a2b0; --faint:#6f7988;
      --line:#2a313b; --line-soft:#222932;
      --brick:#e4705f; --brick-soft:#331f1d;
      --canal:#74b8c6; --canal-soft:#152a2f;
      --gold:#e0ad5e; --gold-soft:#2d2517;
      --good:#58c68d; --good-soft:#15291f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f1217; --card:#171b22; --card2:#1f242d; --ink:#e9edf3; --muted:#99a2b0; --faint:#6f7988;
    --line:#2a313b; --line-soft:#222932;
    --brick:#e4705f; --brick-soft:#331f1d;
    --canal:#74b8c6; --canal-soft:#152a2f;
    --gold:#e0ad5e; --gold-soft:#2d2517;
    --good:#58c68d; --good-soft:#15291f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px calc(96px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:22px}
  button{font:inherit}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:0}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(25px,6.5vw,33px);line-height:1.1;letter-spacing:-.015em;margin:5px 0 0;text-wrap:balance}
  h2{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
  h3{font-weight:600;font-size:16px;margin:4px 0 -5px}
  p{margin:0}
  a{color:var(--brick)}

  header.top{display:flex;align-items:flex-start;gap:12px}
  header.top .grow{flex:1;min-width:0}
  .tgl{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--muted);cursor:pointer;font-size:16px}

  /* ── liste des entretiens ── */
  .list{display:flex;flex-direction:column;gap:10px}
  .ivcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--c,var(--brick));border-radius:5px;padding:15px 16px;cursor:pointer;color:inherit}
  .ivcard:focus-visible{outline:2px solid var(--c,var(--brick));outline-offset:2px}
  .ivcard .when{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--brick))}
  .ivcard .name{font-family:var(--disp);font-weight:700;font-size:19px;margin-top:3px;letter-spacing:-.01em}
  .ivcard .role{color:var(--muted);font-size:14.5px;margin-top:1px}
  .ivcard .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}
  .chip.cd{background:var(--brick-soft);color:var(--brick)}
  .chip.ok{background:var(--good-soft);color:var(--good)}
  .ivcard.done{opacity:.62}

  /* ── fiche ── */
  .back{align-self:flex-start;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:15px}
  nav.secs{display:flex;flex-wrap:wrap;gap:6px}
  nav.secs button{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;padding:6px 10px;border-radius:3px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
  nav.secs button[aria-pressed="true"]{background:var(--c,var(--brick));border-color:var(--c,var(--brick));color:#fff}

  .panel{display:flex;flex-direction:column;gap:14px}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 15px;align-items:baseline}
  dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  dd{margin:0;font-size:16px}
  dd small{display:block;color:var(--muted);font-size:14px;line-height:1.45}
  .box{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:16px;
    display:flex;flex-direction:column;gap:12px}
  .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .figs div{background:var(--card);padding:12px 13px}
  .figs b{display:block;font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .figs small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
  ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  ul li{position:relative;padding-left:16px}
  ul li::before{content:"";position:absolute;left:1px;top:.62em;width:5px;height:5px;border-radius:50%;
    background:var(--c,var(--brick));opacity:.75}
  .key{background:var(--canal-soft);border:1px solid color-mix(in srgb,var(--canal) 30%,transparent);
    border-radius:5px;padding:13px 15px;font-size:15.5px}
  .key .lab{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--canal);margin-bottom:5px}
  .warn{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
    border-radius:5px;padding:13px 15px;font-size:15.5px}
  .qa>div+div{margin-top:15px}
  .qa .q{font-weight:600;font-size:16.5px;margin-bottom:5px}
  .qa .q::before{content:"« ";color:var(--faint)} .qa .q::after{content:" »";color:var(--faint)}
  .qa .a{color:var(--muted);border-left:2px solid var(--line);padding-left:12px;font-size:16px}
  .qa .a b{color:var(--ink);font-weight:600}
  .trap div{padding:11px 0;font-size:15.5px;border-top:1px solid var(--line-soft)}
  .trap div:first-child{border-top:0;padding-top:0}
  .trap b{color:var(--brick);font-weight:600}

  /* ── pitch ── */
  .langs{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;align-self:flex-start}
  .langs button{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;padding:6px 13px;border:0;
    background:var(--card);color:var(--muted);cursor:pointer}
  .langs button+button{border-left:1px solid var(--line)}
  .langs button[aria-pressed="true"]{background:var(--c,var(--brick));color:#fff}
  .beat{display:grid;grid-template-columns:76px 1fr;gap:13px;padding-top:13px;margin-top:13px;border-top:1px solid var(--line-soft)}
  .beat:first-child{padding-top:0;margin-top:0;border-top:0}
  .beat .mk b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--c,var(--brick));font-weight:500}
  .beat .mk span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .beat p+p{margin-top:8px}
  .fill{background:var(--brick-soft);border-bottom:1px solid var(--brick);padding:0 3px;font-style:italic}

  /* ── quiz ── */
  .qz{display:flex;flex-direction:column;gap:16px}
  .qblock{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px}
  .qblock .num{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
  .qblock .txt{font-weight:600;margin:4px 0 11px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{text-align:left;width:100%;padding:10px 12px;border-radius:4px;border:1px solid var(--line);
    background:var(--card2);color:inherit;cursor:pointer;font-size:15.5px;line-height:1.4}
  .opt:focus-visible{outline:2px solid var(--c,var(--brick));outline-offset:2px}
  .opt.good{background:var(--good-soft);border-color:var(--good);color:var(--ink);font-weight:600}
  .opt.bad{background:var(--brick-soft);border-color:var(--brick);color:var(--ink)}
  .why{margin-top:10px;font-size:15px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
  .score{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px;
    display:flex;align-items:center;gap:14px}
  .score b{font-family:var(--disp);font-size:27px;font-variant-numeric:tabular-nums}
  .score small{color:var(--muted);font-size:14px;display:block}
  .reset{margin-left:auto;background:none;border:1px solid var(--line);border-radius:4px;color:var(--muted);
    padding:7px 11px;font-size:13.5px;cursor:pointer}

  /* ── profil ── */
  .cv{display:flex;flex-direction:column;gap:0}
  .cv .row{display:grid;grid-template-columns:96px 1fr;gap:13px;padding:12px 0;border-top:1px solid var(--line-soft)}
  .cv .row:first-child{border-top:0;padding-top:0}
  .cv .yr{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.04em}
  .cv b{font-weight:600}
  .cv small{display:block;color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:2px}
  table.gloss{width:100%;border-collapse:collapse;font-size:15px}
  table.gloss td{border-top:1px solid var(--line-soft);padding:7px 0;vertical-align:top}
  table.gloss tr:first-child td{border-top:0}
  table.gloss td:first-child{color:var(--muted);padding-right:14px;width:48%}
  table.gloss td:last-child{font-weight:600}

  /* ── termes cliquables et fiche de définition ── */
  .gterm{display:inline;background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit;
    font:inherit;text-align:left;border-bottom:1.5px dotted var(--c,var(--brick));line-height:inherit}
  .gterm i{font-style:normal;font-size:.68em;vertical-align:super;color:var(--c,var(--brick));
    font-family:var(--mono);margin-left:1px}
  .gterm:focus-visible{outline:2px solid var(--c,var(--brick));outline-offset:2px}
  #modal[hidden]{display:none}
  #modal{position:fixed;inset:0;background:rgba(8,10,14,.62);z-index:50;display:flex;align-items:flex-end;
    justify-content:center;padding:0}
  #modal .sheet{background:var(--paper);border-top-left-radius:16px;border-top-right-radius:16px;
    width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;
    border:1px solid var(--line);border-bottom:0}
  #modal .shead{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
  #modal .shead h2{flex:1;font-size:19px}
  #modal .x{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--muted);cursor:pointer}
  #modal .sbody{overflow-y:auto;padding:16px 18px calc(26px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:12px;font-size:16px}
  #modal .sbody p{line-height:1.62}
  @media (min-width:700px){ #modal{align-items:center;padding:24px}
    #modal .sheet{border-radius:14px;border-bottom:1px solid var(--line)} }

  /* ── histoire récente ── */
  .hist{display:flex;flex-direction:column}
  .hist .ev{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line-soft)}
  .hist .ev:first-child{border-top:0;padding-top:0}
  .hist .yr{font-family:var(--mono);font-size:11.5px;color:var(--c,var(--brick));letter-spacing:.04em;padding-top:2px}
  .hist b{font-weight:600;display:block}
  .hist small{display:block;color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:2px}

  /* ── barre du bas ── */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:7px 4px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;border-radius:9px}
  .tabbar button .ic{font-size:18px;line-height:1}
  .tabbar button[aria-pressed="true"]{color:var(--brick);background:var(--brick-soft)}
  footer{color:var(--faint);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="modal" hidden></div>

<script>
/* ═══════════════════════════════════════════════════════════════

const DATA = [
  /* ──────────────────────────── ALTUR ──────────────────────────── */
  {

      "<b>La seule promesse faite au marché pour 2026 :</b> un <b>free cash flow positif</b>, objectif maintenu. Aucune guidance d'[[ebitda|EBITDA]] n'est donnée. Quand une entreprise ne s'engage plus que sur sa trésorerie, cela dit où se joue le pilotage : <b>stocks, délais de paiement, besoin en fonds de roulement</b>. C'est le cœur de ton poste.",
      "<b>La contrainte du moment :</b> l'allocation et le prix des <b>composants mémoire</b>. Quand le coût d'un composant s'envole entre la négociation du prix de vente et la production, la marge prévue disparaît — à moins de la répercuter, ce qu'ils font déjà en Eurasie. Arbitrer entre répercuter et perdre un volume, c'est très exactement du [[fpa|contrôle de gestion]]."
    ],
    secteur:[
      ["Le mécanisme central : une industrie de contrats, pas de produits",[
        "Comprends d'abord ceci, parce que tout le reste en découle : Vantiva ne vend pas des box, elle <b>gagne ou perd des appels d'offres</b>. Un opérateur décide d'équiper son parc, lance une consultation pour un modèle précis, un volume annuel et une durée de un à trois ans, et retient un ou deux fournisseurs. Entre deux consultations, il ne se passe rien. Voir [[rfq|appel d'offres opérateur]].",
        "La conséquence est que le chiffre d'affaires n'est <b>ni continu ni élastique</b>. Il ne monte pas parce que le produit est meilleur ou le commercial plus actif : il monte le jour où un contrat est signé, et il tombe d'un bloc le jour où il ne l'est pas. Il n'y a pas de clientèle diffuse pour amortir — quelques acheteurs professionnels décident de dizaines de millions d'euros chacun.",
        "Pour un contrôleur de gestion, cela change le métier. Dans la grande consommation, prévoir veut dire modéliser une demande. Ici, prévoir veut dire <b>suivre un carnet</b> : quels contrats sont gagnés, sur quels volumes, avec quel calendrier de livraison annoncé par le client. La prévision est en grande partie connue d'avance — et c'est précisément pour ça que le moindre glissement de calendrier d'un opérateur fait bouger tout le trimestre."]],
      ["La vérité la plus importante : le prix est fixé avant que le coût soit connu",[
        "C'est l'anomalie structurelle du métier, et si tu ne retiens qu'une chose de cette fiche, prends celle-là. Le prix est arrêté au moment de l'appel d'offres, pour un ou deux ans. Les composants, eux, s'achètent au fil de la production, des mois plus tard, à un prix qui a bougé entre-temps.",
        "Dit autrement, l'équipementier <b>porte le risque de coût sans détenir le levier de prix</b>. Si les composants baissent, le gain revient largement au client au contrat suivant, qui ajustera ses exigences. S'ils montent, la perte est immédiate et entière. C'est une asymétrie défavorable, et elle est inscrite dans la structure même du contrat.",
        "Trois issues seulement quand la [[dram|mémoire]] s'envole : absorber et détruire la marge, [[passthrough|répercuter]] et risquer le volume, ou refuser la commande. Aucune n'est gratuite, et aucune ne se décide sans un chiffrage produit par produit et client par client. <b>Ce chiffrage, c'est littéralement le poste que tu passes.</b> Vantiva a déjà choisi de répercuter sur ses produits vidéo en Eurasie : tu peux le citer, ça montre que tu as lu le communiqué et pas la page « à propos »."]],
      ["Pourquoi les marges sont structurellement minces",[
        "Trois forces poussent dans le même sens, et aucune ne se corrige par l'effort. Le <b>[[bom|coût matière]] écrase tout</b> : dans l'électronique grand public il représente couramment l'essentiel du prix de vente, de l'ordre de 70 à 85 %. La main-d'œuvre, l'usine et la R&amp;D pèsent peu à côté. Quand un composant prend trente pour cent, il n'y a tout simplement pas d'endroit où aller chercher la différence.",
        "Ensuite, <b>le pouvoir de négociation est du mauvais côté</b>. Quelques opérateurs mondiaux face à une poignée de fournisseurs interchangeables sur le papier : le prix se fixe à l'avantage de l'acheteur, toujours.",
        "Enfin, <b>le produit se standardise</b>. Les normes sont publiques, les mêmes puces sont vendues à tout le monde, et un boîtier Wi-Fi ressemble beaucoup à un autre boîtier Wi-Fi. Résultat, une [[marge-brute|marge brute]] basse — souvent dans une fourchette de quinze à vingt-cinq pour cent —, où <b>quelques points de coût matière font passer un contrat de rentable à perdant</b>.",
        "Retourne cette contrainte en argument de motivation : c'est exactement ce qui rend le contrôle de gestion <b>décisif</b> dans ce métier au lieu d'y être une fonction d'appui. Là où la marge est large, une erreur de prévision se rattrape ; ici, elle se paie."]],
      ["Où se loge la valeur quand le produit est banalisé",[
        "Si le matériel est commun, pourquoi les parts de marché ne basculent-elles pas chaque année ? Parce que la vraie barrière n'est pas technique. Elle est faite de trois choses.",
        "La <b>certification chez l'opérateur</b> d'abord : avant de déployer un boîtier chez des centaines de milliers d'abonnés, l'opérateur l'homologue sur son réseau, ses systèmes, ses procédures de support. C'est long et coûteux, et il ne recommence pas volontiers. Un fournisseur déjà certifié est protégé bien plus sûrement que par un brevet.",
        "Le <b>logiciel embarqué</b> ensuite : la valeur d'une box moderne est de plus en plus dans ce qu'elle sait faire — gestion du Wi-Fi domestique, diagnostic à distance, mises à jour — et de moins en moins dans sa tôle. C'est aussi ce qui permet de facturer un service après la vente du matériel.",
        "La <b>position dans la chaîne</b> enfin : concevoir et vendre sous sa marque n'est pas la même chose qu'assembler le plan d'un autre. Plus on se rapproche du simple assemblage, plus on devient interchangeable. Voir [[odm|ODM, OEM et sous-traitance]]."]],
      ["Les deux moteurs, et pourquoi ils ne vont pas dans le même sens",[
        "Le <b>Broadband</b> vit au rythme des générations techniques. Chaque nouvelle norme — [[docsis|DOCSIS sur le câble, fibre jusqu'au logement, Wi-Fi 6 puis 7]] — oblige à remplacer le matériel chez l'abonné. Cela produit une vague de commandes, puis un creux une fois le parc équipé. Et pendant la transition, les opérateurs <b>cessent d'acheter l'ancienne génération sans encore commander la suivante</b> : c'est un trou d'air, pas une perte de marché. C'est exactement ce que la direction décrit aux Amériques.",
        "La <b>Video</b> subit une pression d'une autre nature, structurelle celle-là. L'[[ott|OTT]] installe l'application de streaming directement dans le téléviseur connecté : l'opérateur n'a plus besoin de livrer un décodeur, et un boîtier non fourni est un boîtier non commandé. Cette érosion ne s'inverse pas.",
        "D'où une apparente contradiction qu'il faut savoir lire : la Video recule de <b>21,4 % sur neuf mois</b> — la tendance de fond — mais progresse de <b>25,2 % au troisième trimestre</b>, parce qu'un client important a renouvelé son parc d'un coup. <b>Dans ce secteur, un trimestre ne dit presque rien d'une tendance.</b> Savoir le dire, calmement, te place immédiatement au-dessus d'un candidat qui récite des pourcentages.",
        "Et cela ouvre une idée de gestion rarement maîtrisée par un étudiant : <b>on ne pilote pas une activité en déclin comme une activité en croissance</b>. Sur la vidéo, l'objectif n'est pas de gagner des parts de marché mais d'extraire la trésorerie et de ne pas surinvestir, tout en restant capable de servir les renouvellements quand ils tombent."]],
      ["Pourquoi la trésorerie prime sur la marge, ici",[
        "Un industriel achète ses composants, les stocke, fabrique, livre, puis attend soixante ou quatre-vingt-dix jours d'être payé. Il avance donc l'argent pendant des mois : c'est le [[bfr|besoin en fonds de roulement]], et il grossit mécaniquement avec l'activité.",
        "En période de pénurie, un réflexe parfaitement sain aggrave le problème : on achète d'avance pour sécuriser l'approvisionnement et ne pas rater une livraison. Le stock gonfle. <b>La marge peut rester correcte pendant que la trésorerie se vide</b> — et c'est une entreprise qui meurt de trésorerie, jamais de marge.",
        "C'est la clé de lecture des résultats de Vantiva. La seule promesse maintenue pour 2026 est un <b>[[fcf|free cash flow]] positif</b>, sans aucun objectif d'[[ebitda|EBITDA]]. Quand une direction cesse de s'engager sur la marge et ne s'engage plus que sur le cash, elle dit où est la difficulté — et où se joue réellement le pilotage.",
        "Traduction opérationnelle, et c'est ta meilleure question de la journée : les indicateurs que suit le contrôle de gestion ne sont alors plus seulement la marge par produit, mais <b>la couverture de stock en semaines, les délais de paiement clients et fournisseurs, et le calendrier d'encaissement des gros contrats</b>."]],
      ["Ce que change la taille, et pourquoi ils ont racheté Home Networks",[
        "Dans un métier où le coût matière fait l'essentiel du prix, le seul levier de marge vraiment durable est <b>le pouvoir d'achat</b>. Acheter deux fois plus de mémoire ne coûte pas deux fois plus cher : cela change la place dans la file d'attente du fournisseur et le prix obtenu. En période d'allocation, être un gros client n'est pas un confort, c'est une condition de survie.",
        "Le rachat de l'activité Home Networks à CommScope se lit d'abord comme ça : non pas acheter du chiffre d'affaires, mais acheter de la <b>masse d'achat</b> et un portefeuille d'opérateurs déjà certifiés. Les deux choses qui protègent dans ce métier.",
        "Corollaire utile en entretien : la consolidation du secteur n'est pas une mode financière, elle est une <b>réponse rationnelle à la structure de coûts</b>. C'est le type de raisonnement qu'on attend d'un profil Corporate Finance qui postule en contrôle de gestion."]],
      ["Les six vérités contre-intuitives",[
        "<b>Un.</b> Le chiffre d'affaires est décidé des années avant d'être facturé — il se gagne en appel d'offres, pas sur le marché.",
        "<b>Deux.</b> L'entreprise porte le risque de coût sans détenir le levier de prix : l'asymétrie est contractuelle, pas conjoncturelle.",
        "<b>Trois.</b> Un trimestre ne dit rien d'une tendance. La vidéo recule de 21,4 % sur neuf mois et monte de 25,2 % au trimestre.",
        "<b>Quatre.</b> Un recul aux Amériques peut être une transition de génération, pas une perte de clients. Les deux ne s'arbitrent pas pareil.",
        "<b>Cinq.</b> La marge et la trésorerie peuvent diverger violemment — et c'est la trésorerie qui tue.",
        "<b>Six.</b> La barrière à l'entrée n'est pas la technologie, c'est la certification déjà obtenue chez l'opérateur."]],
      ["Les chiffres à savoir par cœur",[
        "<b>436 M€</b> de chiffre d'affaires au troisième trimestre 2026, en recul de <b>7,3 %</b> (−7,0 % à changes constants). <b>1 170 M€</b> sur neuf mois, en recul de <b>12,1 %</b> (−8,3 % à changes constants).",
        "Au troisième trimestre : <b>Broadband −15,1 %</b>, <b>Video +25,2 %</b>. Sur neuf mois : Broadband −9,1 %, Video −21,4 %. Ne les inverse pas.",
        "Premier semestre 2026 : <b>734 M€</b> de chiffre d'affaires et <b>43 M€</b> d'EBITDA ajusté, contre 66 M€ un an plus tôt.",
        "Et la seule guidance : <b>free cash flow positif en 2026</b>, maintenue. Pas d'objectif d'EBITDA. Environ 13 000 collaborateurs, siège à Issy-les-Moulineaux, direction générale Lars Ihlen."]],
      ["La lecture d'un contrôleur de gestion",[
        "Si on te demande par quoi tu commencerais en arrivant, voilà une réponse qui sonne juste parce qu'elle est vraie. <b>Le coût matière par produit</b>, et de quelles puces il dépend : c'est là qu'est le risque. <b>Les clauses de prix des contrats en cours</b> : que puis-je répercuter, et sous quel délai. <b>La couverture de stock en semaines</b>, par composant critique : combien de trésorerie ai-je immobilisée pour sécuriser quoi. <b>Le carnet par opérateur et son calendrier annoncé</b>, avec la question qui va avec : que devient ma prévision si ce calendrier glisse d'un trimestre.",
        "Et une dernière, plus rare, qui montre qu'on pense en durée : <b>un contrat gagné couvre-t-il ses coûts sur toute sa vie, ou seulement la première année ?</b> Dans un métier où le prix est figé et le coût mobile, la réponse n'est pas évidente — et c'est exactement le genre d'analyse qu'un stagiaire peut produire pour de bon."]]
    ],
    histoire:[
      ["2022","Naissance de Vantiva","La scission de Technicolor sépare les activités créatives des activités industrielles. La partie équipements prend le nom de Vantiva."],

      ["28 oct. 2026","Le point du troisième trimestre","436 M€, −7,3 %. Broadband −15,1 %, Video +25,2 %. Amériques en retrait, Eurasie soutenue par les volumes vidéo et les hausses de prix."],
      ["2026","La guidance maintenue","Free cash flow positif. C'est le seul engagement chiffré que la direction réaffirme dans un environnement qu'elle qualifie d'incertain."]

    angles:[
      "<b>Ici, le contrôle de gestion est un exercice sous contrainte réelle.</b> Des prix négociés à l'avance, un coût de composants qui bouge, des volumes dictés par les cycles d'investissement des opérateurs. Prévoir une marge dans ces conditions est le vrai sujet du poste — dis-le, ça prouve que tu as compris l'entreprise et pas seulement le métier.",
      "<b>La guidance free cash flow t'ouvre une porte.</b> Si l'engagement porte sur la trésorerie et non sur l'EBITDA, alors les stocks de composants, les acomptes et le besoin en fonds de roulement sont au centre. Une question là-dessus te distinguera immédiatement.",
      "<b>Ton modèle de Lille est ta meilleure preuve.</b> À la Caisse des Dépôts, tu as construit un modèle sectoriel sous Excel qui a débouché sur une décision d'organisation. Raconte-le comme ça : un modèle qui sert à décider, pas un tableau.",
      "<b>L'audit et le contrôle de gestion partagent un réflexe.</b> Confronter le chiffre déclaré à la réalité de l'opération. Tu l'as pratiqué sur des processus de prêt encore manuels — c'est transposable tel quel.",
      "<b>Emmanuel Cartier veut comprendre le métier qu'il contrôle.</b> Montre la même curiosité : pose une question sur le produit ou sur le client opérateur, pas seulement sur les processus financiers.",
      "<b>Trente minutes, un seul interlocuteur.</b> Présentation en 90 secondes, réponses de deux minutes, pas de digression. Garde deux questions pour la fin, pas cinq."
    ],
    qa:[
      ["Pourquoi le contrôle de gestion ?","Parce que c'est le métier où la modélisation sert immédiatement à décider. À la Caisse des Dépôts, mon modèle sectoriel a débouché sur une création de poste : c'est ça qui m'a plu, voir un chiffre produire une décision."],
      ["Que savez-vous de Vantiva ?","Issue de Technicolor, recentrée sur le CPE après la cession de Supply Chain Solutions en avril 2025. Au T3 2026, 436 M€, −7,3 %, avec un Broadband en recul de 15,1 % et une Video en hausse de 25,2 % qui rebondit après un début d'année difficile. Amériques en retrait, Eurasie soutenue. Et un objectif de free cash flow positif maintenu."],
      ["Comment aborderiez-vous une hausse du coût des composants ?","<b>La bonne réponse est un arbitrage, pas une formule.</b> Chiffrer l'effet sur la marge par produit et par client, regarder ce que le contrat permet de répercuter, estimer le risque de perte de volume si on répercute, et poser le choix aux opérationnels avec les deux scénarios. Tu peux ajouter qu'ils le font déjà en Eurasie."],
      ["Quel est votre niveau sur Excel ?","Avancé — mais donne l'exemple du modèle de Lille plutôt que l'adjectif. Un niveau se prouve par un livrable."],
      ["Vous venez de l'audit interne, pourquoi la gestion ?","L'audit vérifie le passé, le contrôle de gestion éclaire l'avenir, mais les deux reposent sur le même geste : remonter du chiffre déclaré à l'opération réelle. Je veux maintenant m'en servir pour aider à décider, pas seulement pour constater."],
      ["Vous cherchez bien janvier 2027 ?","Oui, six mois, dans le cadre de mon année de césure à l'ESCP. Sois précis sur les dates."]

    traj:{
      fr:["« Si je postule chez Vantiva, c'est parce que le contrôle de gestion y est un exercice sous contrainte réelle. Vous êtes recentrés sur le CPE depuis la cession de Supply Chain Solutions, les Amériques traversent une transition de génération de produits, et le coût des composants mémoire bouge entre le moment où un prix est négocié et celui où l'on produit.",
        "Et la seule guidance que vous maintenez pour 2026 porte sur le free cash flow : ça me dit que le pilotage se joue sur les stocks et le besoin en fonds de roulement autant que sur la marge. Prévoir dans ces conditions, c'est exactement le genre de modélisation qui m'intéresse — et c'est ce que j'ai fait, à plus petite échelle, sur le secteur des consignations à la Caisse des Dépôts. »"],
      en:["“I'm applying to Vantiva because financial planning here happens under real constraints. The group has refocused on CPE since Supply Chain Solutions was divested, the Americas are going through a product generation transition, and memory component costs move between the moment a price is agreed and the moment you build.",
        "And the only guidance you maintain for 2026 is positive free cash flow — which tells me the steering happens on inventory and working capital as much as on margin. Forecasting in those conditions is exactly the kind of modelling I enjoy, and it's what I did on a smaller scale at Caisse des Dépôts.”"]

    quizSec:[
      ["Pourquoi le chiffre d'affaires est-il discontinu dans ce métier ?",["La demande des abonnés varie selon les saisons","Il se gagne par appels d'offres, contrat par contrat","Les prix changent chaque mois","La production dépend de la météo"],1,"On ne vend pas des box au fil de l'eau : on gagne ou on perd une consultation portant sur un volume annuel et une durée de un à trois ans."],
      ["Qui porte le risque d'une hausse du coût des composants ?",["Le fondeur","L'opérateur, par contrat","L'équipementier, car son prix est déjà figé","L'abonné final"],2,"C'est l'asymétrie centrale : le prix est arrêté à l'appel d'offres, les composants s'achètent des mois plus tard. Le risque de coût est porté sans levier de prix."],
      ["Quelle part du prix de vente le coût matière représente-t-il, en ordre de grandeur ?",["10 à 20 %","30 à 40 %","50 à 60 %","70 à 85 %"],3,"D'où le fait qu'il n'y ait presque rien à comprimer ailleurs : la main-d'œuvre, l'usine et la R&D pèsent peu à côté."],
      ["Qu'est-ce qui protège le mieux un fournisseur déjà en place ?",["Ses brevets","Ses usines","La certification déjà obtenue chez l'opérateur","Sa marque auprès du public"],2,"Refaire homologuer un boîtier coûte des mois à l'opérateur. C'est une barrière plus solide qu'un brevet — et le public ne connaît même pas la marque."],
      ["Un recul aux Amériques dû à une transition de génération de produits, c'est…",["une perte définitive de parts de marché","un trou d'air entre deux cycles d'équipement","un problème de qualité","une sortie du marché"],1,"Les opérateurs cessent d'acheter l'ancienne génération sans commander encore la suivante. Le marché n'est pas perdu, il est suspendu — et les deux situations ne s'arbitrent pas pareil."],
      ["Comment la marge et la trésorerie peuvent-elles diverger violemment ?",["Par un effet de change","Parce qu'on pré-achète du stock pour sécuriser l'approvisionnement","Parce que les salaires augmentent","Parce que les amortissements baissent"],1,"Le réflexe est sain — ne pas rater une livraison — mais le stock immobilise l'argent. La marge tient pendant que la trésorerie se vide."],
      ["Que signifie une guidance de free cash flow sans objectif d'EBITDA ?",["Que l'entreprise ne gagne plus d'argent","Que le pilotage se joue sur les stocks et le besoin en fonds de roulement","Que la marge est garantie","Qu'il n'y a plus d'investissement"],1,"Quand une direction cesse de s'engager sur la marge et ne s'engage plus que sur le cash, elle désigne l'endroit où se joue la difficulté."],
      ["Quel était l'intérêt premier du rachat de Home Networks à CommScope ?",["Acquérir des brevets","Entrer dans un nouveau pays","Gagner de la masse d'achat et des opérateurs déjà certifiés","Diversifier hors du CPE"],2,"Dans un métier où le coût matière fait tout, le pouvoir d'achat est le seul levier de marge durable — et les certifications s'achètent avec le portefeuille clients."],
      ["Comment pilote-t-on une activité en déclin structurel comme la vidéo ?",["En investissant pour reprendre des parts","En extrayant la trésorerie sans surinvestir, tout en servant les renouvellements","En la cédant immédiatement","Comme une activité en croissance"],1,"L'OTT érode la base installée et cela ne s'inverse pas. Mais un gros renouvellement peut faire un trimestre à +25 % : il faut rester capable de servir."]
