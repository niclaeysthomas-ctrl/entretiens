    resume:"Le nouvel [[rang1|équipementier de rang 1]] de la filière nucléaire française, construit par rachats successifs de PME industrielles. Un projet de consolidation ([[buildup|buy-and-build]]) porté par Otium Capital et Arnaud Montebourg.",
    cle:"Cinq acquisitions en moins de dix-huit mois, et une direction financière de groupe à bâtir : consolidation, reporting commun, contrôle interne. C'est du private equity vu de l'intérieur de l'entreprise.",
    figs:[["5","acquisitions en moins de 18 mois"],["2024","année de création du groupe"],["EDF, Framatome","les donneurs d'ordre visés"]],
    boite:[
      "<b>Ce que c'est :</b> un groupe industriel créé de toutes pièces en rachetant des PME, pour fabriquer un <b>[[rang1|équipementier de rang 1]]</b> de la filière nucléaire française. L'ambition est revendiquée telle quelle : devenir « une sorte de <b>Valeo du nucléaire</b> ».",
      "<b>Le problème qu'il résout :</b> la relance du nucléaire suppose des fournisseurs capables de livrer des sous-ensembles complets à EDF et Framatome. Or le tissu français est fait de PME isolées, souvent familiales, excellentes dans un métier mais trop petites pour porter la responsabilité d'un ensemble. Alfeor les fédère pour leur donner une taille critique.",
      "<b>La méthode :</b> un [[buildup|build-up]] — <b>cinq acquisitions en moins de dix-huit mois</b> — avec une promesse faite aux sociétés rachetées : garder leur autonomie, leur nom et leur ancrage local, tout en bénéficiant d'une structure de groupe.",
      "<b>Les cinq sociétés.</b> <b>TSM</b>, traitements de surface et usinage de précision, fondée en 1972. <b>Les Ateliers de la Meuse</b>, grande chaudronnerie, soudure et emballages de combustible nucléaire. <b>Delta Metal</b>, boulonnerie et visserie par forge à chaud, fondée en 1947, environ 40 % de son chiffre d'affaires dans le nucléaire, près d'un million de pièces par an. <b>Deltafluid</b>, instruments de mesure de pression et de débit et contrôle des fluides, une trentaine de salariés. <b>Laboratoire Effitech</b>, essais destructifs et non destructifs.",
      "<b>La chaîne de valeur couverte :</b> forge, fonderie, chaudronnerie, usinage, mécano-soudure, boulonnerie, robinetterie, tuyauterie, fabrication additive, traitement de surface, essais mécaniques et métallurgiques. Les métiers se complètent au lieu de se concurrencer — c'est ce qui permet de vendre un ensemble.",
      "<b>Qui est derrière :</b> <b>Otium Capital</b>, la société d'investissement de Pierre-Édouard Stérin, et <b>Les Équipes du Made in France</b>, la holding d'<b>Arnaud Montebourg</b>, ancien ministre de l'Économie, qui préside le conseil de surveillance. La direction opérationnelle revient à <b>Éric Druenne</b>, cofondateur et directeur général, à <b>Édouard Sagon</b>, directeur des opérations, ancien de Framatome, et à <b>Julien Bourgeois</b>, directeur financier — celui que tu as en face jeudi.",
      "<b>Pourquoi c'est intéressant pour toi :</b> une direction financière de groupe en construction, c'est de la [[pmi|consolidation post-acquisition]] à l'état pur — harmoniser cinq plans comptables, bâtir un reporting commun, installer un contrôle interne là où il n'y en avait pas. C'est du [[lbo|private equity]] vu de l'intérieur de l'entreprise."
    ],
    secteur:[
      ["Le mécanisme central : fabriquer un fournisseur qui n'existe pas",[
        "Comprends d'abord le problème, le reste en découle. La France a cessé de construire des réacteurs pendant une quinzaine d'années. Pendant ce temps, les commandes ont continué au compte-gouttes, les ateliers se sont vidés, les départs en retraite n'ont pas été remplacés. Le rapport commandé après les difficultés du chantier de Flamanville l'a dit sans détour, et EDF y a répondu par un plan de redressement conduit avec le groupement professionnel de la filière. Le diagnostic tenait en un mot : <b>compétences</b>.",
        "Résultat aujourd'hui : beaucoup d'excellentes PME, chacune forte dans un métier — la forge, la chaudronnerie, la robinetterie, les essais — mais <b>aucune capable de livrer un sous-ensemble complet</b> et d'en assumer la responsabilité devant EDF ou Framatome. Or c'est précisément ce que le donneur d'ordre veut acheter : pas vingt pièces à assembler lui-même, un ensemble dont quelqu'un répond.",
        "Alfeor ne crée donc pas une entreprise, il <b>fabrique un fournisseur de [[rang1|rang 1]] en assemblant des fournisseurs de rang 2</b>. L'ambition est revendiquée telle quelle : devenir « une sorte de Valeo du nucléaire ». Cinq acquisitions en moins de dix-huit mois."]],
      ["Pourquoi maintenant, et pourquoi c'est finançable",[
        "Trois carnets se superposent, et c'est leur superposition qui compte. Le <b>neuf</b> : le programme [[epr2|EPR2]], six réacteurs annoncés et huit à l'étude. Le <b>parc existant</b> : le [[carenage|grand carénage]], qui prolonge les réacteurs en service et consomme exactement les mêmes métiers. Et la <b>souveraineté</b>, devenue argument politique autant qu'industriel depuis la crise de l'énergie.",
        "Pour un investisseur, cette superposition donne ce qui manque toujours à l'industrie lourde : de la <b>visibilité</b>. On n'investit pas dans la chaudronnerie sur un carnet de six mois — les délais de qualification à eux seuls dépassent cet horizon.",
        "Et si l'on t'oppose le risque classique, le glissement du calendrier des réacteurs neufs — qui arrive à tous les grands programmes —, la réponse est le grand carénage : <b>le carnet ne dépend pas que du neuf.</b> C'est la meilleure réponse à l'objection la plus prévisible."]],
      ["Pourquoi ces entreprises acceptent de se vendre",[
        "Delta Metal date de 1947, TSM de 1972. Ce ne sont pas des jeunes pousses, ce sont des maisons familiales arrivées au [[transmission|mur de la transmission]] : un dirigeant proche de la retraite, pas de successeur, et un savoir-faire qui tient dans quelques têtes.",
        "Leur alternative est pauvre. Vendre à un concurrent direct, qui regroupera la production et fermera l'atelier. Vendre à un fonds classique, qui revendra dans cinq ans à un inconnu. Ou fermer, ce qui arrive plus souvent qu'on ne croit.",
        "L'argument d'Alfeor est construit exactement contre ces deux peurs : <b>on garde le nom, le site et l'autonomie</b>, on apporte la taille et l'accès aux grands donneurs d'ordre. Ce n'est pas de la communication : c'est ce qui permet d'acheter à un prix raisonnable des entreprises qu'un concurrent aurait dû surpayer. <b>La promesse de ne pas démanteler est un avantage de prix.</b>"]],
      ["Ce qu'on achète réellement : le dossier, pas la machine",[
        "On croit souvent que la barrière à l'entrée d'un industriel est son parc de machines. Dans le nucléaire, c'est faux. Un tour à commande numérique s'achète ; ce qui ne s'achète pas, c'est le droit de livrer.",
        "Une pièce destinée à une centrale ne doit pas seulement être conforme : elle doit être <b>démontrablement</b> conforme, traçable depuis la coulée de l'acier jusqu'au contrôle final, selon des codes propres au secteur — voir [[qualification|la qualification nucléaire]]. Chaque pièce traîne derrière elle un dossier de fabrication nominatif. Obtenir ces agréments prend des années et coûte cher.",
        "Deux conséquences que tu dois pouvoir énoncer. D'abord, <b>c'est l'actif réel de chaque opération</b> : on n'achète pas des machines, on achète des qualifications et les quelques personnes qui savent les tenir. Ensuite, cela éclaire le choix des cibles : le Laboratoire Effitech, qui réalise les essais destructifs et non destructifs, n'est pas un métier de plus dans la liste — c'est la brique qui permet de <b>prouver</b> la conformité de tout le reste, donc de transformer une pièce correcte en pièce livrable."]],
      ["La mécanique du buy-and-build",[
        "Le moteur financier est l'[[multiple|arbitrage de multiple]]. Une PME isolée se valorise bas, parce qu'elle est risquée, dépendante de son dirigeant et difficile à revendre. Un groupe constitué se valorise nettement plus haut. Acheter plusieurs petites et les assembler crée donc de la valeur <b>avant même toute amélioration opérationnelle</b>.",
        "Mais ce raisonnement est purement financier, et il ne tient qu'à une condition : que l'ensemble se comporte vraiment comme un groupe. Comptes [[consolidation|consolidés]] fiables, direction commune, [[synergies|synergies]] réelles. Sinon l'acheteur suivant refusera de payer le multiple de groupe à un simple empilement, et la valeur créée n'aura jamais existé ailleurs que dans un tableur.",
        "Les trois façons d'échouer, qu'il vaut mieux connaître avant qu'on ne te les demande. <b>L'indigestion</b> : acheter plus vite qu'on n'intègre, et se retrouver avec cinq sociétés qui n'ont de commun que l'actionnaire. <b>Le départ des hommes clés</b> : dans une PME de quarante personnes, deux ou trois savent faire ; s'ils partent, la qualification devient théorique et l'actif acheté s'évapore. <b>Le levier de trop</b> : chaque rachat ajoute de la dette immédiatement et de l'EBITDA avec retard, d'où l'importance des [[covenant|covenants]]."]],
      ["La vérité d'auditeur : l'EBITDA qu'on achète n'est pas celui qu'on obtient",[
        "C'est le point que tu peux amener toi-même, et c'est celui qui parlera le plus à un directeur financier venu de l'audit.",
        "Les comptes d'une société familiale contiennent presque toujours ce qui disparaîtra après la vente : la rémunération du dirigeant, hors marché dans un sens ou dans l'autre ; un loyer versé à la société civile immobilière de la famille ; des dépenses personnelles passées en charges ; des éléments exceptionnels qui ne reviendront pas. Avant de valoriser, il faut [[normalisation|normaliser]].",
        "L'enjeu n'est pas cosmétique : <b>chaque retraitement est multiplié par le multiple</b>. À six fois l'EBITDA, retrouver 100 000 € de résultat normalisé déplace le prix de 600 000 €. Ces lignes se négocient une par une, et c'est très exactement le travail d'un auditeur — remonter du chiffre déclaré à la pièce qui le justifie.",
        "Son corollaire après l'acquisition : le <b>[[proforma|pro forma]]</b>. Une société rachetée en juin n'entre dans les comptes que pour six mois ; l'année suivante pour douze. La croissance affichée sera spectaculaire sans qu'aucune société n'ait vendu un euro de plus. Chez un acquéreur en série, retraiter les périmètres pour comparer ce qui est comparable est un travail permanent."]],
      ["Comment se finance une opération de ce type",[
        "Le schéma habituel combine quatre briques. Des <b>fonds propres</b> apportés par les actionnaires — ici Otium Capital et Les Équipes du Made in France. De la <b>dette bancaire</b>, remboursée par les remontées des sociétés rachetées. Parfois de la <b>[[mezz|dette mezzanine]]</b> quand les banques ne veulent pas aller plus loin mais que l'actionnaire ne veut pas se diluer. Et très souvent un <b>[[earnout|complément de prix]]</b>, payé plus tard et conditionné aux résultats, qui sert à combler un désaccord de valeur et à retenir le dirigeant qui reste.",
        "Je ne connais pas la structure exacte d'Alfeor et tu ne dois pas l'inventer. En revanche, savoir que ces briques existent te permet de poser une vraie question plutôt qu'une question d'école.",
        "Côté direction financière, chacune crée du travail : la dette impose de suivre des ratios à dates fixes, le complément de prix se provisionne et se mesure, et les indicateurs qui le déclenchent doivent être définis au cordeau sous peine de litige."]],
      ["Pourquoi, ici, c'est la direction financière qui crée la valeur",[
        "C'est ton meilleur argument de motivation, et il est vrai. Dans un groupe établi, la direction financière mesure une performance produite ailleurs. Dans un groupe en construction, <b>elle fabrique les instruments de mesure eux-mêmes</b> — et sans eux, rien ne vaut rien.",
        "Reprends la chaîne : l'arbitrage de multiple ne se matérialise qu'à la revente ou au refinancement ; l'acheteur suivant ne paiera le prix d'un groupe que s'il voit des comptes consolidés fiables, un reporting commun, un contrôle interne crédible ; ces trois choses n'existent pas spontanément quand on réunit cinq PME. <b>Donc le travail de la direction financière n'est pas un support : c'est lui qui transforme cinq sociétés en un actif qui vaut plus que leur somme.</b>",
        "Dis cela à Julien Bourgeois et tu auras expliqué, sans le flatter, pourquoi tu veux faire ce stage-là plutôt qu'un autre."]],
      ["Les six vérités contre-intuitives",[
        "<b>Un.</b> Ce qu'on achète n'est pas un outil industriel, ce sont des qualifications et les gens qui les portent.",
        "<b>Deux.</b> Promettre de ne pas démanteler n'est pas de la morale, c'est un avantage de prix face à un acheteur industriel.",
        "<b>Trois.</b> L'EBITDA affiché par une PME familiale n'est presque jamais celui qu'on achète : il se normalise, ligne par ligne, et chaque ligne est multipliée par le multiple.",
        "<b>Quatre.</b> La croissance d'un groupe qui rachète n'est pas de la croissance tant qu'on ne l'a pas retraitée à périmètre comparable.",
        "<b>Cinq.</b> Les synergies de coûts se réalisent, les synergies de revenus déçoivent — parce que les premières dépendent de soi et les secondes du client.",
        "<b>Six.</b> La valeur créée par l'assemblage n'existe que si les comptes la rendent démontrable. Sans consolidation fiable, l'arbitrage de multiple reste un tableur."]],
      ["Les cinq questions d'un financier dans ce secteur",[
        "<b>Un.</b> Qu'achète-t-on exactement : des machines, ou des qualifications et les hommes qui les tiennent ? <b>Deux.</b> Quelle part du carnet dépend d'EDF et de Framatome, et que devient le plan si un programme glisse d'un an ? <b>Trois.</b> Les synergies annoncées sont-elles des coûts, qui se réalisent, ou des revenus, qui déçoivent ? <b>Quatre.</b> À quelle vitesse peut-on intégrer sans casser ce qu'on a payé — c'est-à-dire sans faire partir les quelques personnes qui portent la qualification ? <b>Cinq.</b> Où en est le ratio de dette sur EBITDA, et combien d'acquisitions reste-t-il avant de devoir refinancer ?"]]
    ],
    histoire:[
      ["2024","Création du groupe","Alfeor naît de l'association entre Les Équipes du Made in France et Otium Capital, avec l'objectif annoncé de contribuer à la souveraineté industrielle française."],
      ["avril 2024","L'équipe se constitue","Nominations au sein de l'équipe chargée des partenariats et des acquisitions — avant même les premiers rachats. L'ordre est révélateur : on bâtit d'abord la capacité à acheter."],
      ["mai–juin 2024","Les premières acquisitions","Deux séries d'opérations en six semaines font entrer dans le groupe des entreprises clés de la filière nucléaire."],
      ["2025","Deltafluid rejoint le groupe","Le contrôle des fluides et l'instrumentation de mesure complètent la chaîne : Alfeor ne vend plus seulement de la pièce mécanique, mais aussi de la mesure."],
      ["mi-2025","Cinq sociétés fédérées","TSM, Les Ateliers de la Meuse, Delta Metal, Deltafluid et le Laboratoire Effitech. Moins de dix-huit mois depuis la première opération."]
    ],
    angles:[
      "<b>Il a annoncé le sujet, prends-le au mot.</b> Sa phrase était : « valider avec toi tes motivations sur le choix d'un projet industriel ». Ce n'est pas un entretien technique, c'est un entretien sur un choix. Il veut savoir si tu as choisi l'industrie exprès, ou si Alfeor est une ligne de plus dans une liste de candidatures.",
      "<b>Il vient de l'audit, comme toi.</b> Trois conséquences : il repère un candidat qui récite, c'est son métier ; il préférera un « je ne sais pas » franc à une broderie ; et il sera sensible à un intérêt réel pour l'objet industriel, pas seulement pour le montage financier.",
      "<b>Amène toi-même la normalisation de l'EBITDA.</b> C'est le pont parfait entre ton été en audit interne et son quotidien : remonter du chiffre déclaré à la pièce qui le justifie, sauf qu'ici chaque ligne retrouvée est multipliée par le multiple de valorisation.",
      "<b>Dans un groupe en construction, il n'y a pas assez de bras.</b> Un stagiaire n'y est pas un confort, il produit quelque chose qui n'existait pas. Dis-le : c'est vrai, et ça répond à la question muette de tout recruteur de stage.",
      "<b>Ton ancrage régional compte ici aussi.</b> Bac à Genech, prépa à Douai : tu viens d'une région industrielle, et un groupe qui promet de préserver l'ancrage local de chaque PME rachetée ne te parle pas comme à un candidat parisien.",
      "<b>Trente minutes, un seul interlocuteur, en visio.</b> Présentation en 90 secondes, réponses de deux minutes, deux questions gardées pour la fin."
    ],
    qa:[
      ["Pourquoi un projet industriel ?","<b>La question de l'entretien.</b> Trois appuis que tu possèdes réellement. Ton été à la Caisse des Dépôts, passé sur des financements de très long terme d'intérêt général : l'industrie lourde a le même horizon, des décisions qui engagent trente ans — tu ne viens donc pas du trading, tu continues une ligne. Les Hauts-de-France, région industrielle où tu as fait ton bac et ta prépa. Et le motif honnête : en conseil, on livre une recommandation et on passe au dossier suivant ; ici, on voit la pièce sortir de l'atelier."],
      ["Pourquoi le nucléaire plutôt qu'une autre industrie ?","Parce que ce n'est pas interchangeable : la relance crée un besoin de fournisseurs de rang 1 structurés, là où le tissu français est fait de PME isolées. C'est exactement le problème qu'Alfeor résout — et c'est rare de pouvoir rejoindre un groupe au moment où il se construit plutôt que dix ans après."],
      ["Qu'est-ce qui vous attire dans une direction financière de groupe en construction ?","Tout est à bâtir : consolidation, reporting commun, contrôle interne dans cinq sociétés qui n'en avaient pas. Et ce n'est pas un travail de support — sans comptes fiables, l'arbitrage de multiple reste un tableur. <b>C'est la direction financière qui transforme cinq PME en un actif qui vaut plus que leur somme.</b>"],
      ["Vous avez fait de l'audit : qu'en retirez-vous d'utile ici ?","Le réflexe de remonter à la pièce justificative, et l'habitude des environnements où les processus sont encore manuels — c'est précisément ce que j'ai audité à la Caisse des Dépôts. Dans une acquisition, c'est ce réflexe qui sert à normaliser un EBITDA."],
      ["Que savez-vous d'Alfeor ?","Cinq sociétés fédérées en moins de dix-huit mois — TSM, Les Ateliers de la Meuse, Delta Metal, Deltafluid, le Laboratoire Effitech — pour construire un équipementier de rang 1 de la filière nucléaire, avec Otium Capital et Les Équipes du Made in France. Et une promesse faite aux sociétés rachetées : garder leur nom, leur site et leur autonomie."],
      ["Quelles difficultés voyez-vous dans ce modèle ?","<b>Ne réponds pas « aucune ».</b> Trois risques réels : acheter plus vite qu'on n'intègre ; perdre les deux ou trois personnes qui portent la qualification, auquel cas l'actif acheté s'évapore ; et le levier, puisque chaque rachat ajoute de la dette tout de suite et de l'EBITDA plus tard."]
    ],
    poser:[
      "Après cinq acquisitions en dix-huit mois, où en êtes-vous de l'harmonisation du reporting — chaque société a-t-elle déjà le même calendrier de clôture ?",
      "Comment produisez-vous des comparaisons à périmètre comparable quand le périmètre change plusieurs fois par an ?",

      "Les dirigeants restent-ils après la vente, et le prix comporte-t-il une part conditionnée à la performance ?",
      "Comment conciliez-vous l'autonomie promise à chaque société et le besoin d'un contrôle de gestion groupe ?",
      "Quelle part du carnet dépend d'EDF et de Framatome, et cherchez-vous à diversifier vers l'aéronautique ou la défense ?"
    ],
    pieges:[
      "<b>Ne réduis pas Alfeor à Montebourg.</b> Il préside le conseil de surveillance, mais le groupe est dirigé par Éric Druenne et financé par Otium Capital.",
      "<b>Ne parle pas de « start-up industrielle ».</b> Ce sont des maisons de 1947 et 1972 que l'on fédère.",
      "<b>Ne confonds pas rang 1 et sous-traitance.</b> Toute l'ambition est justement de passer de l'un à l'autre.",
      "<b>Ne survends pas ta connaissance du nucléaire.</b> Tu connais le modèle économique et la logique de filière, pas la technique. Devant un ancien auditeur, le reconnaître est un point gagné.",

    traj:{
      fr:["« Si je postule chez Alfeor, c'est parce que c'est un projet de consolidation industrielle, et que la direction financière y est au centre : cinq acquisitions en dix-huit mois, cinq sociétés avec leurs propres habitudes comptables, et un reporting groupe à construire.",
        "C'est du private equity vu de l'intérieur, dans une filière — le nucléaire — où la relance crée un vrai besoin d'équipementiers de rang 1. Et mon passage en audit interne à la Caisse des Dépôts m'a donné le réflexe qui sert ici : aller vérifier, dans des processus encore manuels, si le chiffre déclaré correspond à l'opération réelle. »"],
      en:["“I'm applying to Alfeor because it's an industrial consolidation project where the finance function sits at the centre: five acquisitions in eighteen months, five companies with their own accounting habits, and group reporting still to be built.”"]
    },
    quizSec:[
      ["Quelle est la vraie barrière à l'entrée dans la filière nucléaire ?",["Le coût des machines","La qualification et la traçabilité documentaire","Le prix de l'acier","La taille des ateliers"],1,"Une pièce doit être démontrablement conforme, traçable de la coulée au contrôle final. Obtenir ces agréments prend des années."],
      ["Qu'achète-t-on réellement en rachetant une de ces PME ?",["Des tours et des fraiseuses","Des qualifications et les gens qui savent les tenir","Un carnet de commandes à court terme","Un terrain industriel"],1,"L'outil se rachète ; la qualification et le savoir-faire humain, non. Le départ de deux ou trois personnes clés peut vider une acquisition de sa valeur."],
      ["En quoi consiste l'arbitrage de multiple ?",["Acheter cher et revendre plus cher","Acheter des PME à bas multiple pour former un groupe valorisé plus haut","Multiplier les fournisseurs","Négocier des remises de volume"],1,"Assembler crée de la valeur avant même toute amélioration opérationnelle — à condition que l'ensemble se comporte vraiment comme un groupe."],
      ["Pourquoi normalise-t-on l'EBITDA d'une cible ?",["Pour payer moins d'impôt","Pour retirer ce qui disparaîtra après la vente : rémunération du dirigeant, loyer familial, exceptionnels","Pour lisser la saisonnalité","Pour convertir en normes internationales"],1,"On cherche le résultat que la société dégagerait entre des mains normales. Et chaque retraitement est multiplié par le multiple de valorisation."],
      ["À six fois l'EBITDA, que vaut un retraitement de 100 000 € ?",["100 000 € de prix","600 000 € de prix","16 000 € de prix","Rien, c'est hors périmètre"],1,"D'où le fait que ces lignes se négocient une par une : 100 000 € × 6 = 600 000 € sur le prix."],
      ["À quoi servent les comptes pro forma ?",["À prévoir l'année suivante","À comparer deux exercices à périmètre identique malgré les acquisitions","À calculer l'impôt","À présenter les comptes aux salariés"],1,"Une société rachetée en juin ne compte que six mois la première année et douze la suivante : sans retraitement, la croissance affichée est un artefact."],
      ["Qu'est-ce qu'un complément de prix, ou earn-out ?",["Une pénalité de retard","Une part du prix payée plus tard, conditionnée aux résultats","Une garantie bancaire","Un intéressement des salariés"],1,"Il comble un désaccord de valeur et retient le dirigeant qui reste. Côté finance, il se provisionne et se mesure — et se dispute si les indicateurs sont mal définis."],
