<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LES ENTRETIENS</title>
<meta name="theme-color" content="#11141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --paper:#f5f7f9; --card:#fff; --card2:#eef1f5; --ink:#161a21; --muted:#5c6474; --faint:#8b94a3;
    --line:#dce1e8; --line-soft:#e9edf2;
    --brick:#a8342a; --brick-soft:#f4e4e2;
    --canal:#245c69; --canal-soft:#e1eced;
    --gold:#8a5a10; --gold-soft:#f8eeda;
    --good:#1b7a4b; --good-soft:#e2f1e8;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --disp:"Bitter",Georgia,serif;
    --body:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0f1217; --card:#171b22; --card2:#1f242d; --ink:#e9edf3; --muted:#99a2b0; --faint:#6f7988;
      --line:#2a313b; --line-soft:#222932;
      --brick:#e4705f; --brick-soft:#331f1d;
      --canal:#74b8c6; --canal-soft:#152a2f;
      --gold:#e0ad5e; --gold-soft:#2d2517;
      --good:#58c68d; --good-soft:#15291f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f1217; --card:#171b22; --card2:#1f242d; --ink:#e9edf3; --muted:#99a2b0; --faint:#6f7988;
    --line:#2a313b; --line-soft:#222932;
    --brick:#e4705f; --brick-soft:#331f1d;
    --canal:#74b8c6; --canal-soft:#152a2f;
    --gold:#e0ad5e; --gold-soft:#2d2517;
    --good:#58c68d; --good-soft:#15291f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px calc(96px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:22px}
  button{font:inherit}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:0}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(25px,6.5vw,33px);line-height:1.1;letter-spacing:-.015em;margin:5px 0 0;text-wrap:balance}
  h2{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
  h3{font-weight:600;font-size:16px;margin:4px 0 -5px}
  p{margin:0}
  a{color:var(--brick)}

  header.top{display:flex;align-items:flex-start;gap:12px}
  header.top .grow{flex:1;min-width:0}
  .tgl{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--muted);cursor:pointer;font-size:16px}

  /* ── liste des entretiens ── */
  .list{display:flex;flex-direction:column;gap:10px}
  .ivcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--c,var(--brick));border-radius:5px;padding:15px 16px;cursor:pointer;color:inherit}
  .ivcard:focus-visible{outline:2px solid var(--c,var(--brick));outline-offset:2px}
  .ivcard .when{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--brick))}
  .ivcard .name{font-family:var(--disp);font-weight:700;font-size:19px;margin-top:3px;letter-spacing:-.01em}
  .ivcard .role{color:var(--muted);font-size:14.5px;margin-top:1px}
  .ivcard .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}
  .chip.cd{background:var(--brick-soft);color:var(--brick)}
  .chip.ok{background:var(--good-soft);color:var(--good)}
  .ivcard.done{opacity:.62}

  /* ── fiche ── */
  .back{align-self:flex-start;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:15px}
  nav.secs{display:flex;flex-wrap:wrap;gap:6px}
  nav.secs button{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;padding:6px 10px;border-radius:3px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
  nav.secs button[aria-pressed="true"]{background:var(--c,var(--brick));border-color:var(--c,var(--brick));color:#fff}

  .panel{display:flex;flex-direction:column;gap:14px}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 15px;align-items:baseline}
  dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  dd{margin:0;font-size:16px}
  dd small{display:block;color:var(--muted);font-size:14px;line-height:1.45}
  .box{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:16px;
    display:flex;flex-direction:column;gap:12px}
  .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .figs div{background:var(--card);padding:12px 13px}
  .figs b{display:block;font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .figs small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
  ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  ul li{position:relative;padding-left:16px}
  ul li::before{content:"";position:absolute;left:1px;top:.62em;width:5px;height:5px;border-radius:50%;
    background:var(--c,var(--brick));opacity:.75}
  .key{background:var(--canal-soft);border:1px solid color-mix(in srgb,var(--canal) 30%,transparent);
    border-radius:5px;padding:13px 15px;font-size:15.5px}
  .key .lab{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--canal);margin-bottom:5px}
  .warn{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
    border-radius:5px;padding:13px 15px;font-size:15.5px}
  .qa>div+div{margin-top:15px}
  .qa .q{font-weight:600;font-size:16.5px;margin-bottom:5px}
  .qa .q::before{content:"« ";color:var(--faint)} .qa .q::after{content:" »";color:var(--faint)}
  .qa .a{color:var(--muted);border-left:2px solid var(--line);padding-left:12px;font-size:16px}
  .qa .a b{color:var(--ink);font-weight:600}
  .trap div{padding:11px 0;font-size:15.5px;border-top:1px solid var(--line-soft)}
  .trap div:first-child{border-top:0;padding-top:0}
  .trap b{color:var(--brick);font-weight:600}

  /* ── pitch ── */
  .langs{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;align-self:flex-start}
  .langs button{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;padding:6px 13px;border:0;
    background:var(--card);color:var(--muted);cursor:pointer}
  .langs button+button{border-left:1px solid var(--line)}
  .langs button[aria-pressed="true"]{background:var(--c,var(--brick));color:#fff}
  .beat{display:grid;grid-template-columns:76px 1fr;gap:13px;padding-top:13px;margin-top:13px;border-top:1px solid var(--line-soft)}
  .beat:first-child{padding-top:0;margin-top:0;border-top:0}
  .beat .mk b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--c,var(--brick));font-weight:500}
  .beat .mk span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .beat p+p{margin-top:8px}
  .fill{background:var(--brick-soft);border-bottom:1px solid var(--brick);padding:0 3px;font-style:italic}

  /* ── quiz ── */
  .qz{display:flex;flex-direction:column;gap:16px}
  .qblock{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px}
  .qblock .num{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
  .qblock .txt{font-weight:600;margin:4px 0 11px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{text-align:left;width:100%;padding:10px 12px;border-radius:4px;border:1px solid var(--line);
    background:var(--card2);color:inherit;cursor:pointer;font-size:15.5px;line-height:1.4}
  .opt:focus-visible{outline:2px solid var(--c,var(--brick));outline-offset:2px}
  .opt.good{background:var(--good-soft);border-color:var(--good);color:var(--ink);font-weight:600}
  .opt.bad{background:var(--brick-soft);border-color:var(--brick);color:var(--ink)}
  .why{margin-top:10px;font-size:15px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
  .score{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px;
    display:flex;align-items:center;gap:14px}
  .score b{font-family:var(--disp);font-size:27px;font-variant-numeric:tabular-nums}
  .score small{color:var(--muted);font-size:14px;display:block}
  .reset{margin-left:auto;background:none;border:1px solid var(--line);border-radius:4px;color:var(--muted);
    padding:7px 11px;font-size:13.5px;cursor:pointer}

  /* ── profil ── */
  .cv{display:flex;flex-direction:column;gap:0}
  .cv .row{display:grid;grid-template-columns:96px 1fr;gap:13px;padding:12px 0;border-top:1px solid var(--line-soft)}
  .cv .row:first-child{border-top:0;padding-top:0}
  .cv .yr{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.04em}
  .cv b{font-weight:600}
  .cv small{display:block;color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:2px}
  table.gloss{width:100%;border-collapse:collapse;font-size:15px}
  table.gloss td{border-top:1px solid var(--line-soft);padding:7px 0;vertical-align:top}
  table.gloss tr:first-child td{border-top:0}
  table.gloss td:first-child{color:var(--muted);padding-right:14px;width:48%}
  table.gloss td:last-child{font-weight:600}

  /* ── termes cliquables et fiche de définition ── */
  .gterm{display:inline;background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit;
    font:inherit;text-align:left;border-bottom:1.5px dotted var(--c,var(--brick));line-height:inherit}
  .gterm i{font-style:normal;font-size:.68em;vertical-align:super;color:var(--c,var(--brick));
    font-family:var(--mono);margin-left:1px}
  .gterm:focus-visible{outline:2px solid var(--c,var(--brick));outline-offset:2px}
  #modal[hidden]{display:none}
  #modal{position:fixed;inset:0;background:rgba(8,10,14,.62);z-index:50;display:flex;align-items:flex-end;
    justify-content:center;padding:0}
  #modal .sheet{background:var(--paper);border-top-left-radius:16px;border-top-right-radius:16px;
    width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;
    border:1px solid var(--line);border-bottom:0}
  #modal .shead{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
  #modal .shead h2{flex:1;font-size:19px}
  #modal .x{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--muted);cursor:pointer}
  #modal .sbody{overflow-y:auto;padding:16px 18px calc(26px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:12px;font-size:16px}
  #modal .sbody p{line-height:1.62}
  @media (min-width:700px){ #modal{align-items:center;padding:24px}
    #modal .sheet{border-radius:14px;border-bottom:1px solid var(--line)} }

  /* ── histoire récente ── */
  .hist{display:flex;flex-direction:column}
  .hist .ev{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line-soft)}
  .hist .ev:first-child{border-top:0;padding-top:0}
  .hist .yr{font-family:var(--mono);font-size:11.5px;color:var(--c,var(--brick));letter-spacing:.04em;padding-top:2px}
  .hist b{font-weight:600;display:block}
  .hist small{display:block;color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:2px}

  /* ── barre du bas ── */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:7px 4px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;border-radius:9px}
  .tabbar button .ic{font-size:18px;line-height:1}
  .tabbar button[aria-pressed="true"]{color:var(--brick);background:var(--brick-soft)}
  footer{color:var(--faint);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="modal" hidden></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   LES ENTRETIENS — fiches, profil et quiz, hors ligne.
   Toutes les données tiennent dans DATA : une entreprise = un objet.
   ═══════════════════════════════════════════════════════════════ */

const MOI = {
  nom:"Thomas Niclaeys", tel:"", mail:"",
  formation:[
    ["2024-2028","ESCP Business School","Master in Management, M2. Paris et Madrid. Double spécialisation <b>Corporate Finance</b> et <b>Consulting &amp; Strategy</b>."],

    ["depuis 2024","Tuteur indépendant — mathématiques et anglais","Paris. Plans de travail sur mesure pour 4 élèves, <b>+4 points de moyenne</b> en quelques semaines. 6 h par semaine, suivi régulier auprès des parents."]
  ],
  autres:[
    "<b>Échecs</b> — environ 2150 Elo, vainqueur de tournois, vice-président du club, vainqueur de la coupe Saint-Jean 2024. Ce n'est pas un loisir à citer en fin d'entretien : à ce niveau, c'est une preuve de calcul, de patience et de gestion du temps sous pression. En face d'un investisseur, c'est un atout plus parlant qu'un adjectif sur un CV.",
    "<b>Kryptosphere</b> — analyse des implications politiques, réglementaires et macroéconomiques des stablecoins, et co-organisation de conférences blockchain à plus de 100 participants. À sortir si la conversation glisse sur la régulation, les paiements ou l'innovation financière.",

/* Le socle du pitch, identique partout : d'où je viens, ce que j'ai fait.
   Seule la trajectoire change d'une entreprise à l'autre. */
const SOCLE = {
  fr:[
    {t:"Ancrage", s:"0:00", p:[
      "« Bonjour, je m'appelle Thomas Niclaeys. Je suis en Master in Management à l'ESCP Business School, en double spécialisation <b>Corporate Finance</b> et <b>Consulting &amp; Strategy</b>, entre Paris et Madrid.",

  ],
  en:[
    {t:"Anchor", s:"0:00", p:[
      "“Hello, my name is Thomas Niclaeys. I'm a Master in Management student at ESCP Business School, with a double specialisation in <b>Corporate Finance</b> and <b>Consulting &amp; Strategy</b>, between Paris and Madrid.",
      "I did my <b>baccalauréat in Genech</b> and my <b>preparatory class in Douai</b>: I'm from the Hauts-de-France region.”"]},
    {t:"Proof", s:"0:20", p:[
      "“Both of my internships were at <b>Caisse des Dépôts</b>, the French public financial institution.",

      "What I take from it is the habit of checking whether what is written actually matches what happens.”"]}

};

const DATA = [
  /* ──────────────────────────── ALTUR ──────────────────────────── */
  {
    id:"altur", nom:"Altur Investissement", couleur:"#b4793a",
    poste:"Analyste Private Equity — stage mars 2027",
    date:"2026-11-18", heure:"17:00", fin:"18:00",
    format:"Second tour, en présentiel — une heure", lieu:"9 rue de Téhéran, Paris 8",
    gens:[
      ["Charles-Edouard Potel","Ton contact dans la maison","Il t'a vu le 9 novembre, brièvement, et c'est lui qui a proposé ce second rendez-vous dans leurs bureaux. Son adresse est cepotel@alturgestion.com : la société de gestion, pas le véhicule d'investissement."],
      ["François Lombard","Président et fondateur","ESSEC, MBA Wharton, PhD Penn. IFC (Banque mondiale) en 1977, puis CCF, CDC Participations, Épargne Partenaires en 1989, Turenne Capital en 1999, Altur en 2006."]
    ],
    resume:"Société d'investissement créée en 2006, sortie de la cote en 2024, devenue le [[fo|single family office]] de la famille Lombard. [[small-cap|Small cap]] patrimonial et familial.",
    cle:"Potel l'écrit noir sur blanc : « à l'issue de notre courte rencontre de ce lundi, nous souhaiterions en apprendre plus sur toi ». Le 9 novembre était un filtre ; celui-ci décide. Et François Lombard est en copie du message.",
    figs:[["1–5 M€","ticket par investissement direct"],["2–20 M€","de CA des sociétés visées"],["50+","participations depuis 2006"],["9","secteurs de prédilection"]],
    boite:[
      "<b>Ce que c'est :</b> une société d'investissement en [[small-cap|capital-développement]], c'est-à-dire qu'elle prend des participations dans des entreprises non cotées déjà rentables, pour financer leur croissance ou organiser leur transmission. Elle n'est pas un fonds classique mais un [[fo|single family office]] : l'argent est d'abord celui de la famille Lombard.",
      "<b>Son calibre :</b> des tickets de <b>1 à 5 M€</b> dans des sociétés réalisant <b>2 à 20 M€</b> de chiffre d'affaires, en majoritaire comme en minoritaire. C'est du small cap patrimonial et familial — rien à voir avec le [[lbo|LBO]] large cap.",
      "<b>Un modèle de plateforme à quatre axes :</b> [[lp|LP dans des fonds tiers, co-investissement, investissement direct et fonds sponsorisés]]. Cette diversité est la réponse d'une petite structure à un problème simple : un seul fonds de 50 M€ ne permet pas de voir assez d'affaires.",
      "<b>Neuf secteurs :</b> santé, transition écologique, éducation, aménagement urbain, numérique, formation professionnelle, hôtellerie, services aux entreprises, industrie. Dans les faits, la verticale éducation et formation est le moteur actuel.",
      "<b>Altur EdTrain :</b> un [[fpci]] dédié à l'éducation et à la formation, [[closing|premier closing à 10 M€]] pour une cible de 30 M€ et un hard cap à 50 M€, classé [[sfdr|article 8 SFDR]] et éligible au [[b150|150-0 B ter]]. Il porte ArtFX, Avenir Santé Formation et Opus Formation.",
      "<b>Le track record :</b> plus de 50 participations depuis 2006, avec Webhelp, Menix, Complétude-Kinougarde et Biobank parmi les sorties emblématiques.",
      "<b>L'équipe, quatre personnes :</b> François Lombard (président), Rémy Lombard (DG adjoint, <b>ESCP</b>, ex-Bain, arrivé en 2022), Bertrand Cavalié (DG adjoint, EDHEC et Toulouse School of Economics, ex-Société Générale Private Banking et Grant Thornton, il porte EdTrain), Marie-Laure Moneret (directrice administrative et financière)."
    ],
    secteur:[
      ["Le mécanisme central : d'où vient réellement l'argent d'un fonds",[
        "Comprends d'abord la mécanique de base, parce que tout le métier en découle. Un fonds de private equity ne place pas son propre argent. Il lève des engagements auprès d'investisseurs — assureurs, caisses de retraite, family offices, particuliers fortunés — qu'on appelle les [[lp|<i>limited partners</i>]]. L'équipe de gestion, le <i>general partner</i>, décide où investir et prend les décisions.",
        "L'argent n'est pas versé d'un coup : il est <b>appelé</b> au fur et à mesure des opérations. Le fonds a une durée de vie finie, généralement dix ans : quatre ou cinq ans pour investir, le reste pour accompagner puis revendre et rendre l'argent.",
        "La rémunération suit deux canaux, et les connaître explique presque tous les comportements du secteur. Les <b>frais de gestion</b>, de l'ordre de 2 % des montants gérés par an, paient les salaires et le loyer — ils tombent que les opérations réussissent ou non. Le <b>[[carried|carried interest]]</b>, typiquement 20 % de la plus-value au-delà d'un rendement minimal garanti aux investisseurs, est le vrai levier d'enrichissement de l'équipe.",
        "<b>Altur est une exception à ce schéma, et c'est le point à ne pas rater.</b> Depuis sa sortie de la cote en 2024, c'est d'abord un [[fo|family office]] : l'argent investi est en grande partie celui de la famille Lombard. Il n'y a donc pas de fonds à rendre à une échéance imposée. La maison lève par ailleurs des véhicules auprès de tiers — Altur EdTrain — mais son cœur n'obéit pas au calendrier d'un fonds classique."]],
      ["Comment un fonds gagne de l'argent : les trois moteurs",[
        "Quand un investisseur achète une société 100 et la revend 200, il faut savoir d'où viennent les 100 de plus. Il n'y a que trois sources, et un bon candidat sait les séparer.",
        "<b>La croissance du résultat.</b> L'entreprise gagne plus qu'avant : nouveaux clients, nouveaux produits, meilleures marges, acquisitions. C'est la création de valeur la plus défendable, celle dont un investisseur peut se vanter.",
        "<b>L'expansion du multiple.</b> On a acheté à six fois le résultat et on revend à huit fois, parce que le marché s'est réchauffé ou parce que la société est devenue plus grosse et donc mieux valorisée — voir [[multiple|l'arbitrage de multiple]]. Cette source-là ne dépend pas entièrement de soi.",
        "<b>Le désendettement.</b> Dans un [[lbo|LBO]], la dette se rembourse avec les flux de l'entreprise. À valeur d'entreprise constante, la part revenant à l'actionnaire grossit mécaniquement.",
        "<b>Chez Altur, le premier moteur domine.</b> Sur des sociétés de 2 à 20 M€ de chiffre d'affaires, prises souvent en minoritaire et sans dette massive, on ne gagne pas par le levier : on gagne en aidant l'entreprise à grandir. Dis-le, c'est exactement ce qui distingue le [[small-cap|small cap]] du large cap."]],
      ["Pourquoi le small cap n'est pas un large cap en plus petit",[
        "Quatre différences de nature, pas de taille.",
        "<b>Le prix d'entrée.</b> Moins de fonds en face, des processus souvent de gré à gré plutôt que des enchères, donc des multiples d'entrée plus bas. C'est l'avantage structurel du segment.",
        "<b>Le travail après.</b> Une société de 10 M€ de chiffre d'affaires n'a souvent ni directeur financier, ni reporting mensuel, ni plan à trois ans. L'investisseur apporte la structuration elle-même. <b>Le rendement vient du travail, pas du montage.</b>",
        "<b>La dépendance au dirigeant.</b> Dans une PME, l'homme clé est souvent le fondateur. Son départ, sa démotivation ou un conflit d'actionnaires pèsent plus lourd que n'importe quel ratio.",
        "<b>La sortie.</b> Moins d'acheteurs possibles, et presque jamais de mise en Bourse. On revend à un industriel ou à un fonds plus gros — ce qui suppose d'avoir rendu la société assez grande et assez propre pour les intéresser."]],
      ["Le marché français en 2026 : où en est-on",[
        "Quelques repères de place, rapportés par la presse spécialisée au premier semestre 2026 — à citer comme des ordres de grandeur, jamais comme des chiffres que tu aurais vérifiés toi-même.",
        "<b>La France reste le deuxième marché européen</b>, derrière le Royaume-Uni. Au premier semestre, de l'ordre de <b>14 Md€ investis</b> et <b>17 Md€ levés</b>. Les investisseurs étrangers représenteraient désormais près de <b>38 % des montants levés</b>, contre 31 % un an plus tôt.",
        "<b>Les sorties se débloquent.</b> Environ <b>630 sociétés cédées pour 6,1 Md€</b>, en hausse d'à peu près un quart en valeur sur un an. Les ventes à un industriel représentent près de la moitié des sorties ; la Bourse, une petite minorité.",
        "<b>Le small cap est le segment le plus actif</b>, pendant que le mid cap marque le pas.",
        "<b>Et l'ombre portée :</b> l'incertitude politique à l'approche de l'élection présidentielle de 2027 freine la reprise — un investisseur déteste moins une mauvaise nouvelle qu'une nouvelle inconnue, parce qu'il ne sait pas quoi mettre dans son plan.",
        "Ce que tu en fais en entretien : cela explique pourquoi un acteur positionné sur le small cap patrimonial, qui n'a pas de fonds à rendre à échéance, est mieux placé qu'un fonds classique pour traverser une période incertaine. <b>C'est un compliment argumenté, pas une flatterie.</b>"]],
      ["Les opérations d'Altur à connaître",[
        "<b>Altur EdTrain</b> est le fil rouge actuel : un [[fpci|FPCI]] dédié à l'éducation et à la formation, créé en 2023, [[closing|premier closing à 10 M€]] pour une cible de 30 M€ et un hard cap à 50 M€, classé [[sfdr|article 8 SFDR]] et éligible au [[b150|150-0 B ter]]. Tickets annoncés de <b>2 à 8 M€</b> par opération, quatre sociétés en portefeuille à l'été 2026.",
        "<b>ArtFX</b>, école d'animation et d'effets visuels, en [[mbo|MBO]] d'avril 2025, au moment même du premier closing du fonds. <b>Avenir Santé Formation.</b> <b>Opus Formation</b>, organisme lyonnais de formation professionnelle, en [[lbo|LBO]] de mai 2026.",
        "<b>Eléas</b>, cabinet francilien de conseil et de formation sur les risques psychosociaux, qui a réalisé une acquisition en septembre 2026 aux côtés de Financière Vecteur : un [[buildup|build-up]] classique.",
        "<b>Vizcab</b>, éditeur lyonnais de logiciels de budget carbone, extension de série A en juin 2024 — la verticale transition écologique.",
        "Et les sorties historiques qui fondent la crédibilité de la maison : <b>Webhelp</b>, <b>Menix</b>, <b>Complétude-Kinougarde</b>, <b>Biobank</b>.",
        "<b>Choisis-en une et travaille-la.</b> Opus Formation est la meilleure : récente, dans la verticale moteur, et elle te permet de dérouler une thèse — revenus récurrents, marché fragmenté donc consolidable, et un risque réglementaire réel du côté du financement public de la formation. Poser le risque toi-même est ce qui sépare une analyse d'un argumentaire."]],
      ["Les six vérités contre-intuitives",[
        "<b>Un.</b> Un fonds ne place pas son argent : il place celui d'autres, et sa rémunération dépend davantage de la plus-value que des frais. Sauf dans un family office, où l'argent est le sien.",
        "<b>Deux.</b> La performance d'un investissement ne vient pas d'une seule source : croissance du résultat, expansion du multiple, désendettement. Un bon analyste les sépare toujours.",
        "<b>Trois.</b> En small cap, le rendement vient du travail d'accompagnement, pas du levier financier.",
        "<b>Quatre.</b> Le prix d'entrée bas n'est pas une aubaine : il rémunère l'illiquidité, la dépendance au dirigeant et l'absence de structure.",
        "<b>Cinq.</b> La sortie se prépare dès l'entrée. Acheter sans savoir à qui l'on revendra est la faute classique du segment.",
        "<b>Six.</b> Un family office n'a pas d'échéance imposée : cela change le type de sociétés qu'il peut acheter, et le temps qu'il peut passer à les redresser."]]
    ],
    histoire:[
      ["2006","Création sous le nom Turenne Investissement","À l'initiative de François Lombard, qui avait déjà fondé Épargne Partenaires en 1989 puis Turenne Capital en 1999."],
      ["2015","Cotation sur Euronext","Compartiment C. La société devient un véhicule coté de capital-développement, accessible aux particuliers."],
      ["2020","Reprise d'un portefeuille en secondaire","Rachat d'un bloc de six participations d'un coup — une façon rapide de reconstituer un portefeuille."],
      ["jan. 2024","Sortie de la Bourse","[[opas|OPAS]] de Suffren Holding, la holding familiale, à 11 € par action sur les 10,48 % du capital qu'elle ne détenait pas, suivie d'un [[retrait|retrait obligatoire]]. Altur redevient privée et se réinvente en family office."],
      ["juin 2024","Vizcab","Participation à l'extension de la série A de cet éditeur lyonnais de logiciels de budget carbone — la verticale transition écologique."],
      ["avril 2025","ArtFX et le lancement d'EdTrain","[[mbo|MBO]] de l'école d'animation et d'effets visuels, au moment même du premier closing du fonds EdTrain."],
      ["mai 2026","Opus Formation","Premier [[lbo|LBO]] de cet organisme de formation professionnelle lyonnais."],
      ["sept. 2026","Build-up Eléas","Le cabinet francilien de conseil et de formation sur les risques psychosociaux réalise une acquisition, aux côtés de Financière Vecteur. Un [[buildup|build-up]] classique."]
    ],
    metier:[
      ["Ce qu'on attend d'un analyste private equity en stage",[
        "Le quotidien, sans embellissement. <b>Le sourcing :</b> repérer des sociétés qui correspondent à la thèse, par secteur, taille et géographie, et préparer des fiches courtes. <b>L'analyse :</b> lire des comptes, retraiter, construire un modèle simple, calculer un rendement. <b>La due diligence :</b> suivre les travaux des experts, préparer des synthèses. <b>Le suivi du portefeuille :</b> collecter le reporting des participations et préparer les comités.",
        "Ce qu'on juge vraiment : la <b>rigueur du chiffre</b>, la <b>capacité à résumer</b> — un investisseur veut une recommandation en une page, pas un rapport —, et le <b>jugement</b>, c'est-à-dire savoir dire ce qui cloche dans un dossier plutôt que d'habiller une présentation.",
        "Dans une équipe de quatre personnes, tu verras la thèse, la due diligence et le dirigeant. C'est l'argument de candidature le plus solide, et il est vrai."]],
      ["Le LBO, à savoir dérouler de tête",[
        "Le mécanisme : une holding emprunte une partie du prix et rachète la cible. La dette se rembourse ensuite avec les flux de trésorerie de la société rachetée. L'investisseur n'a mis qu'une fraction du prix, ce qui démultiplie son rendement — et ses pertes.",
        "<b>L'exemple à faire tourner.</b> Société valorisée <b>50 M€</b>, soit 5 × un EBITDA de 10 M€. Financement : <b>25 M€ de dette</b>, <b>25 M€ d'apport</b>. Au bout de cinq ans, l'EBITDA est passé à <b>14 M€</b>, et la société a remboursé <b>15 M€</b> de dette grâce à ses flux.",
        "<b>La sortie, au même multiple de 5 :</b> valeur d'entreprise = 14 × 5 = <b>70 M€</b>. On retranche la dette restante, 25 − 15 = 10 M€. La valeur revenant à l'actionnaire est donc <b>60 M€</b>, contre 25 investis.",
        "<b>Le multiple sur fonds propres</b> = 60 ÷ 25 = <b>2,4×</b>. <b>Le taux de rendement interne</b> sur cinq ans = 2,4^(1/5) − 1 ≈ <b>19 % par an</b>.",
        "<b>Et la décomposition qu'on te demandera :</b> sur les 35 M€ de gain, la croissance du résultat apporte (14 − 10) × 5 = <b>20 M€</b>, le désendettement apporte <b>15 M€</b>, et l'expansion de multiple <b>zéro</b> puisqu'on sort au même multiple. Savoir répartir le gain entre ces trois sources est exactement ce qu'un investisseur attend d'un analyste."]],
      ["TRI et multiple : la règle de trois à connaître",[
        "Le <b>multiple sur fonds propres</b> dit combien de fois on a multiplié sa mise. Le <b>taux de rendement interne</b> dit à quelle vitesse. Les deux sont nécessaires : 2× en deux ans est excellent, 2× en dix ans est médiocre.",
        "La conversion : <b>TRI = multiple^(1/années) − 1</b>. Les repères à mémoriser, parce qu'ils reviennent sans cesse : <b>2× en 3 ans ≈ 26 %</b> ; <b>2× en 5 ans ≈ 15 %</b> ; <b>3× en 5 ans ≈ 25 %</b> ; <b>2,5× en 5 ans ≈ 20 %</b>.",
        "Le piège du TRI : il récompense la vitesse. Revendre vite une petite plus-value affiche un TRI flatteur mais crée peu de valeur en euros. C'est pourquoi on regarde toujours les deux ensemble — et c'est le genre de nuance qui fait bonne impression."]],
      ["Ce qu'on regarde dans une société avant d'investir",[
        "Quatre familles de questions, dans l'ordre où on les pose.",
        "<b>Le marché :</b> croît-il, est-il fragmenté, qui sont les concurrents, les clients peuvent-ils imposer leur prix ?",
        "<b>L'entreprise :</b> les revenus sont-ils récurrents ou faut-il les regagner chaque année ? Quelle est la concentration client — si un client fait 40 % du chiffre d'affaires, c'est un risque, pas une référence ? La marge tient-elle quand les volumes baissent ?",
        "<b>L'homme :</b> le dirigeant reste-t-il, réinvestit-il à nos côtés, et que se passe-t-il s'il part ? En small cap, c'est souvent la question décisive.",
        "<b>La sortie :</b> à qui revendra-t-on dans cinq ans, et que faut-il avoir construit d'ici là pour que cet acheteur existe ?",
        "Puis vient la [[dd|due diligence]], qui vérifie les réponses : financière, juridique, fiscale, sociale, et de plus en plus environnementale. Chacune peut faire baisser le prix, ajouter une garantie, ou faire renoncer."]],
      ["Les retraitements qui changent le prix",[
        "Le point commun avec ton été en audit, et le meilleur pont que tu puisses construire. Le résultat affiché par une PME familiale n'est presque jamais celui qu'on achète : il faut le [[normalisation|normaliser]].",
        "Les retraitements habituels : la rémunération du dirigeant, souvent hors marché dans un sens ou dans l'autre ; un loyer versé à la société civile immobilière de la famille ; des dépenses personnelles passées en charges ; des produits ou charges exceptionnels qui ne reviendront pas.",
        "<b>Et l'effet de levier du retraitement :</b> à un multiple de 6, retrouver 100 000 € de résultat normalisé déplace le prix de <b>600 000 €</b>. C'est pour cela que ces lignes se négocient une par une.",
        "Deuxième notion liée : la <b>dette nette</b> et le passage de la valeur d'entreprise à la valeur des titres. On valorise l'activité — la valeur d'entreprise — puis on retranche la dette et on ajoute la trésorerie pour obtenir ce que touche le vendeur. Les discussions portent souvent sur ce qui compte comme dette : engagements de retraite, comptes courants d'associés, dividendes votés non versés."]],
      ["La dette d'un LBO, et ce qui se passe quand ça dérape",[
        "Trois étages, du moins cher au plus cher. La <b>dette senior</b>, bancaire, la mieux protégée, remboursée en premier. L'<b>unitranche</b>, prêtée par un fonds de dette, plus chère mais plus souple et plus rapide à obtenir — très répandue sur le mid-market. La <b>[[mezz|mezzanine]]</b>, remboursée après les banques et avant les actionnaires, donc la plus chère.",
        "Le niveau d'endettement se dit en multiple : <b>dette nette sur EBITDA</b>. Sur du small cap, on reste nettement sous les niveaux du large cap, parce que les flux d'une PME sont plus volatils.",
        "Deux mécanismes à connaître. Le <b><i>cash sweep</i></b> : une part du cash excédentaire sert obligatoirement à rembourser la dette par anticipation, ce qui accélère le [[multiple|désendettement]] mais prive l'entreprise de moyens. Et les <b>[[covenant|covenants]]</b>, testés à dates fixes.",
        "Ce qui se passe au franchissement d'un covenant, dans l'ordre réel : on négocie un <i>waiver</i>, c'est-à-dire une renonciation ponctuelle de la banque, contre une commission et souvent un taux relevé ; si la situation dure, on rouvre le dossier — rallonge d'actionnaire, rééchelonnement, parfois conversion de dette en capital, qui dilue l'actionnaire. <b>Le défaut juridique immédiat est l'exception, pas la règle.</b> Le dire ainsi montre qu'on sait comment ça se passe vraiment."]],
      ["Le partage du gain : waterfall, carried, management package",[
        "Quand un fonds revend, l'argent ne se partage pas au prorata. Il descend un escalier — le [[waterfall|waterfall]] : les investisseurs récupèrent d'abord leur mise, puis un rendement préférentiel d'environ 8 % par an, puis l'équipe rattrape sa part, et le surplus se partage généralement 80 / 20.",
        "Ces 20 % sont le [[carried|carried interest]], le vrai levier d'enrichissement d'une équipe de gestion. Les frais de gestion, autour de 2 % par an, paient la maison ; ils n'enrichissent personne.",
        "Du côté de la société rachetée, le <b>[[management-package|management package]]</b> fait le même travail sur les dirigeants : ils investissent leur propre argent à conditions favorables, et touchent une part croissante de la plus-value au-delà d'un seuil de rendement. Avec, en face, les clauses <i>good leaver</i> et <i>bad leaver</i>.",
        "<b>Pourquoi un analyste doit le savoir :</b> parce que ces mécanismes expliquent les comportements. Une équipe qui n'a pas atteint son seuil de rendement ne raisonne pas comme une équipe qui l'a dépassé."]],
      ["Protéger un minoritaire : le pacte d'actionnaires",[
        "Altur prend souvent des positions minoritaires. Un minoritaire sans pacte est un passager sans ceinture : il subit les décisions et ne maîtrise pas sa sortie. Tout se joue dans le [[pacte|pacte d'actionnaires]].",
        "<b>Gouvernance :</b> un siège au conseil et des droits de veto sur ce qui engage l'entreprise — endettement, acquisition, changement de métier, rémunération du dirigeant.",
        "<b>Une précision à ne pas rater, parce qu'on l'entend souvent de travers :</b> le <b>tag-along</b> protège le minoritaire, en lui permettant de se joindre à la vente du majoritaire aux mêmes conditions. Le <b>drag-along</b> fait l'inverse : il <i>oblige</i> le minoritaire à vendre si le majoritaire a trouvé un acheteur pour la totalité. C'est une clause de sortie, utile à qui la détient — pas une protection du minoritaire. Les citer tous les deux comme des protections est l'erreur classique.",
        "<b>Et le reste :</b> clause de liquidité pour organiser la sortie au terme d'une période, anti-dilution en cas d'augmentation de capital à bas prix, good leaver / bad leaver sur les titres des dirigeants."]],
      ["La garantie d'actif et de passif, prolongement de l'audit",[
        "Après la [[dd|due diligence]] vient ce qu'on n'a pas pu vérifier. La <b>[[gap|garantie d'actif et de passif]]</b> est la clause par laquelle le vendeur répond des passifs qui apparaîtraient après la vente mais trouveraient leur origine avant — un redressement fiscal sur un exercice antérieur, un litige prud'homal, un stock surévalué.",
        "Elle se négocie sur quatre paramètres : le <b>plafond</b>, la <b>franchise</b>, la <b>durée</b>, et surtout la <b>garantie de la garantie</b> — séquestre ou caution bancaire, pour s'assurer que le vendeur sera encore solvable le jour où on l'appellera.",
        "<b>C'est ton meilleur pont avec l'audit</b>, et il est direct : plus la due diligence a été approfondie, moins on a besoin de garanties ; plus elle a été expédiée, plus il faut se couvrir par le contrat. Le travail de vérification et le travail juridique sont les deux faces d'un même risque."]],
      ["Les multiples du marché aujourd'hui",[
        "L'[[argos|Argos Index]] est la référence citable : au <b>deuxième trimestre 2026</b>, le multiple médian du mid-market de la zone euro s'établit à <b>8,8× l'EBITDA</b>, en hausse de 2,3 %. Avec un écart marqué selon l'acheteur — <b>fonds d'investissement à 10,2×</b>, <b>acquéreurs industriels à 7,9×</b> — et une part des opérations sous 7× qui remonte à 27 %.",
        "<b>Et la nuance qui transformera une citation en analyse :</b> l'Argos couvre le mid-market, soit des valeurs d'entreprise d'environ 15 à 500 M€, et la hausse du trimestre vient du haut de ce segment. <b>Altur investit nettement en dessous.</b> Dire « l'indice est à 8,8× mais il ne couvre pas votre segment, où les multiples d'entrée sont structurellement plus bas » vaut dix fois mieux que de réciter le chiffre.",
        "Pourquoi les fonds paient plus cher que les industriels en ce moment : ils disposent de capitaux engagés qu'il faut déployer, et ils acceptent un prix d'entrée élevé en comptant sur le levier et la croissance. Un industriel, lui, compare au coût de faire la même chose en interne."]],
      ["Le DCF, déroulé proprement",[
        "La question « walk me through a DCF » tombe souvent, et se répond en cinq temps, dans l'ordre.",
        "<b>Un.</b> Projeter les flux de trésorerie disponibles pour l'entreprise sur cinq à sept ans : [[ebitda|EBITDA]], moins l'impôt théorique calculé sur le résultat d'exploitation, moins les investissements, moins la variation du [[bfr|besoin en fonds de roulement]].",
        "<b>Deux.</b> Déterminer le taux d'actualisation : le coût moyen pondéré du capital, qui combine le coût des fonds propres — [[medaf|MEDAF]], plus une prime de taille et d'illiquidité pour une PME — et le coût de la dette après impôt.",
        "<b>Trois.</b> Estimer la valeur terminale, soit par la formule de Gordon-Shapiro avec un taux de croissance perpétuelle modeste, soit par un multiple de sortie. <b>Attention :</b> dans un DCF à cinq ans, la valeur terminale pèse souvent les deux tiers du résultat — c'est l'hypothèse la plus fragile de tout l'exercice, et le dire spontanément fait bonne impression.",
        "<b>Quatre.</b> Actualiser, additionner : on obtient la valeur d'entreprise. <b>Cinq.</b> Retrancher la dette nette et les éléments assimilés pour obtenir la valeur des titres.",
        "Et termine toujours par la <b>sensibilité</b> : une grille croisant le coût du capital et le taux de croissance perpétuelle. Un DCF donné sans fourchette est un DCF qu'on n'a pas compris."]]
,
      ["Les questions techniques qui tombent, et la bonne réponse",[

  /* ─────────────────────────── VANTIVA ─────────────────────────── */
  {
    id:"vantiva", nom:"Vantiva", couleur:"#245c69",
    poste:"Stage — Contrôle de gestion / FP&A, janvier 2027",
    date:"2026-11-18", heure:"10:00", fin:"11:00",
    format:"Second tour, en présentiel — une heure", lieu:"10 boulevard de Grenelle, Paris 15. Emmanuel Cartier vient te chercher à l'accueil.",
    gens:[
      ["Emmanuel Cartier","Dirigeant de Vantiva Technologies, l'entité française","Tu l'as déjà vu le 12 novembre en visio. Il te reçoit maintenant dans ses locaux, pendant une heure : c'est un signal favorable. Ce n'est pas un recruteur : c'est un financier de plus de 25 ans de métier. Diplômé de Rouen Business School, ancien contrôleur de gestion, avec une expatriation en Malaisie chez Alcatel. Il dirige l'entité française depuis juillet 2026. Ce qu'en disent ses anciens collègues est l'information la plus utile : <b>il s'intéresse réellement au métier qu'il contrôle</b>, pas seulement aux chiffres. C'est le comportement à refléter."]
    ],
    resume:"Ex-Technicolor, cotée à Paris. Équipementier mondial du [[cpe|CPE]] — box internet, passerelles, répéteurs [[docsis|Wi-Fi]], décodeurs — vendu aux opérateurs télécoms et de télévision payante par [[rfq|appels d'offres]]. Recentrée sur ce seul métier depuis 2025.",
    cle:"C'est un <b>second tour</b>, en face à face, une heure au lieu de trente minutes : on ne te fait plus passer un filtre, on t'évalue. Et depuis le premier entretien, la pénurie de mémoire s'est aggravée — c'est le sujet le plus actuel que tu puisses amener toi-même.",
    figs:[["436 M€","de CA au T3 2026, −7,3 %"],["1 170 M€","sur neuf mois, −12,1 %"],["−15,1 %","Broadband au T3"],["+25,2 %","Video au T3"],["~13 000","collaborateurs"],["FCF positif","la seule guidance 2026"]],
    boite:[
      "<b>Ce que c'est :</b> un industriel qui conçoit et fabrique les boîtiers que ton opérateur te livre à la maison — box internet, passerelle Wi-Fi, répéteur, décodeur TV, objets connectés. Le métier s'appelle le [[cpe|CPE]]. Direction générale : <b>Lars Ihlen</b>.",
      "<b>Son client n'est pas toi.</b> Vantiva vend aux <b>opérateurs et fournisseurs de télévision payante</b>, par appels d'offres et par volumes énormes. Peu de clients, très gros, donc une pression permanente sur les prix et des volumes qui suivent les cycles d'investissement des opérateurs — pas la demande des particuliers.",
      "<b>D'où elle vient :</b> de la scission de <b>Technicolor</b>, l'ancien Thomson. Cotée sur Euronext Paris, siège à Issy-les-Moulineaux, environ 13 000 collaborateurs après l'intégration de l'activité Home Networks rachetée à CommScope.",
      "<b>Les chiffres du troisième trimestre 2026 :</b> <b>436 M€</b> de chiffre d'affaires, en baisse de <b>7,3 %</b> (−7,0 % à changes constants). Sur neuf mois, <b>1 170 M€</b>, en baisse de <b>12,1 %</b> (−8,3 % à changes constants).",
      "<b>Deux activités qui ne vont pas dans le même sens — et attention au contre-pied.</b> Au T3, le <b>Broadband recule de 15,1 %</b> tandis que la <b>Video progresse de 25,2 %</b>. Sur neuf mois en revanche, Broadband −9,1 % et Video −21,4 % : la vidéo <i>rebondit</i> au troisième trimestre après un début d'année très mauvais. Dire « la vidéo s'effondre » serait faux sur le trimestre en cours.",
      "<b>Par région :</b> les <b>Amériques faiblissent</b> — transition de génération de produits et moindres investissements des opérateurs. L'<b>Eurasie tient</b>, grâce à de fortes livraisons vidéo à un client clé <b>et à des hausses de prix répercutant l'évolution du coût des composants</b>.",
      "<b>Le recentrage :</b> la division Supply Chain Solutions a été <b>cédée en avril 2025</b>. Vantiva n'est plus un groupe à deux jambes, c'est un pur acteur du CPE — ne parle donc pas de logistique comme d'une activité maison.",
      "<b>La seule promesse faite au marché pour 2026 :</b> un <b>free cash flow positif</b>, objectif maintenu. Aucune guidance d'[[ebitda|EBITDA]] n'est donnée. Quand une entreprise ne s'engage plus que sur sa trésorerie, cela dit où se joue le pilotage : <b>stocks, délais de paiement, besoin en fonds de roulement</b>. C'est le cœur de ton poste.",
      "<b>La contrainte du moment :</b> l'allocation et le prix des <b>composants mémoire</b>. Quand le coût d'un composant s'envole entre la négociation du prix de vente et la production, la marge prévue disparaît — à moins de la répercuter, ce qu'ils font déjà en Eurasie. Arbitrer entre répercuter et perdre un volume, c'est très exactement du [[fpa|contrôle de gestion]]."
    ],
    secteur:[
      ["Le mécanisme central : une industrie de contrats, pas de produits",[
        "Comprends d'abord ceci, parce que tout le reste en découle : Vantiva ne vend pas des box, elle <b>gagne ou perd des appels d'offres</b>. Un opérateur décide d'équiper son parc, lance une consultation pour un modèle précis, un volume annuel et une durée de un à trois ans, et retient un ou deux fournisseurs. Entre deux consultations, il ne se passe rien. Voir [[rfq|appel d'offres opérateur]].",
        "La conséquence est que le chiffre d'affaires n'est <b>ni continu ni élastique</b>. Il ne monte pas parce que le produit est meilleur ou le commercial plus actif : il monte le jour où un contrat est signé, et il tombe d'un bloc le jour où il ne l'est pas. Il n'y a pas de clientèle diffuse pour amortir — quelques acheteurs professionnels décident de dizaines de millions d'euros chacun.",
        "Pour un contrôleur de gestion, cela change le métier. Dans la grande consommation, prévoir veut dire modéliser une demande. Ici, prévoir veut dire <b>suivre un carnet</b> : quels contrats sont gagnés, sur quels volumes, avec quel calendrier de livraison annoncé par le client. La prévision est en grande partie connue d'avance — et c'est précisément pour ça que le moindre glissement de calendrier d'un opérateur fait bouger tout le trimestre."]],
      ["La vérité la plus importante : le prix est fixé avant que le coût soit connu",[
        "C'est l'anomalie structurelle du métier, et si tu ne retiens qu'une chose de cette fiche, prends celle-là. Le prix est arrêté au moment de l'appel d'offres, pour un ou deux ans. Les composants, eux, s'achètent au fil de la production, des mois plus tard, à un prix qui a bougé entre-temps.",
        "Dit autrement, l'équipementier <b>porte le risque de coût sans détenir le levier de prix</b>. Si les composants baissent, le gain revient largement au client au contrat suivant, qui ajustera ses exigences. S'ils montent, la perte est immédiate et entière. C'est une asymétrie défavorable, et elle est inscrite dans la structure même du contrat.",
        "Trois issues seulement quand la [[dram|mémoire]] s'envole : absorber et détruire la marge, [[passthrough|répercuter]] et risquer le volume, ou refuser la commande. Aucune n'est gratuite, et aucune ne se décide sans un chiffrage produit par produit et client par client. <b>Ce chiffrage, c'est littéralement le poste que tu passes.</b> Vantiva a déjà choisi de répercuter sur ses produits vidéo en Eurasie : tu peux le citer, ça montre que tu as lu le communiqué et pas la page « à propos »."]],
      ["Pourquoi les marges sont structurellement minces",[
        "Trois forces poussent dans le même sens, et aucune ne se corrige par l'effort. Le <b>[[bom|coût matière]] écrase tout</b> : dans l'électronique grand public il représente couramment l'essentiel du prix de vente, de l'ordre de 70 à 85 %. La main-d'œuvre, l'usine et la R&amp;D pèsent peu à côté. Quand un composant prend trente pour cent, il n'y a tout simplement pas d'endroit où aller chercher la différence.",
        "Ensuite, <b>le pouvoir de négociation est du mauvais côté</b>. Quelques opérateurs mondiaux face à une poignée de fournisseurs interchangeables sur le papier : le prix se fixe à l'avantage de l'acheteur, toujours.",
        "Enfin, <b>le produit se standardise</b>. Les normes sont publiques, les mêmes puces sont vendues à tout le monde, et un boîtier Wi-Fi ressemble beaucoup à un autre boîtier Wi-Fi. Résultat, une [[marge-brute|marge brute]] basse — souvent dans une fourchette de quinze à vingt-cinq pour cent —, où <b>quelques points de coût matière font passer un contrat de rentable à perdant</b>.",
        "Retourne cette contrainte en argument de motivation : c'est exactement ce qui rend le contrôle de gestion <b>décisif</b> dans ce métier au lieu d'y être une fonction d'appui. Là où la marge est large, une erreur de prévision se rattrape ; ici, elle se paie."]],
      ["Où se loge la valeur quand le produit est banalisé",[
        "Si le matériel est commun, pourquoi les parts de marché ne basculent-elles pas chaque année ? Parce que la vraie barrière n'est pas technique. Elle est faite de trois choses.",
        "La <b>certification chez l'opérateur</b> d'abord : avant de déployer un boîtier chez des centaines de milliers d'abonnés, l'opérateur l'homologue sur son réseau, ses systèmes, ses procédures de support. C'est long et coûteux, et il ne recommence pas volontiers. Un fournisseur déjà certifié est protégé bien plus sûrement que par un brevet.",
        "Le <b>logiciel embarqué</b> ensuite : la valeur d'une box moderne est de plus en plus dans ce qu'elle sait faire — gestion du Wi-Fi domestique, diagnostic à distance, mises à jour — et de moins en moins dans sa tôle. C'est aussi ce qui permet de facturer un service après la vente du matériel.",
        "La <b>position dans la chaîne</b> enfin : concevoir et vendre sous sa marque n'est pas la même chose qu'assembler le plan d'un autre. Plus on se rapproche du simple assemblage, plus on devient interchangeable. Voir [[odm|ODM, OEM et sous-traitance]]."]],
      ["Les deux moteurs, et pourquoi ils ne vont pas dans le même sens",[
        "Le <b>Broadband</b> vit au rythme des générations techniques. Chaque nouvelle norme — [[docsis|DOCSIS sur le câble, fibre jusqu'au logement, Wi-Fi 6 puis 7]] — oblige à remplacer le matériel chez l'abonné. Cela produit une vague de commandes, puis un creux une fois le parc équipé. Et pendant la transition, les opérateurs <b>cessent d'acheter l'ancienne génération sans encore commander la suivante</b> : c'est un trou d'air, pas une perte de marché. C'est exactement ce que la direction décrit aux Amériques.",
        "La <b>Video</b> subit une pression d'une autre nature, structurelle celle-là. L'[[ott|OTT]] installe l'application de streaming directement dans le téléviseur connecté : l'opérateur n'a plus besoin de livrer un décodeur, et un boîtier non fourni est un boîtier non commandé. Cette érosion ne s'inverse pas.",
        "D'où une apparente contradiction qu'il faut savoir lire : la Video recule de <b>21,4 % sur neuf mois</b> — la tendance de fond — mais progresse de <b>25,2 % au troisième trimestre</b>, parce qu'un client important a renouvelé son parc d'un coup. <b>Dans ce secteur, un trimestre ne dit presque rien d'une tendance.</b> Savoir le dire, calmement, te place immédiatement au-dessus d'un candidat qui récite des pourcentages.",
        "Et cela ouvre une idée de gestion rarement maîtrisée par un étudiant : <b>on ne pilote pas une activité en déclin comme une activité en croissance</b>. Sur la vidéo, l'objectif n'est pas de gagner des parts de marché mais d'extraire la trésorerie et de ne pas surinvestir, tout en restant capable de servir les renouvellements quand ils tombent."]],
      ["Pourquoi la trésorerie prime sur la marge, ici",[
        "Un industriel achète ses composants, les stocke, fabrique, livre, puis attend soixante ou quatre-vingt-dix jours d'être payé. Il avance donc l'argent pendant des mois : c'est le [[bfr|besoin en fonds de roulement]], et il grossit mécaniquement avec l'activité.",
        "En période de pénurie, un réflexe parfaitement sain aggrave le problème : on achète d'avance pour sécuriser l'approvisionnement et ne pas rater une livraison. Le stock gonfle. <b>La marge peut rester correcte pendant que la trésorerie se vide</b> — et c'est une entreprise qui meurt de trésorerie, jamais de marge.",
        "C'est la clé de lecture des résultats de Vantiva. La seule promesse maintenue pour 2026 est un <b>[[fcf|free cash flow]] positif</b>, sans aucun objectif d'[[ebitda|EBITDA]]. Quand une direction cesse de s'engager sur la marge et ne s'engage plus que sur le cash, elle dit où est la difficulté — et où se joue réellement le pilotage.",
        "Traduction opérationnelle, et c'est ta meilleure question de la journée : les indicateurs que suit le contrôle de gestion ne sont alors plus seulement la marge par produit, mais <b>la couverture de stock en semaines, les délais de paiement clients et fournisseurs, et le calendrier d'encaissement des gros contrats</b>."]],
      ["Ce que change la taille, et pourquoi ils ont racheté Home Networks",[
        "Dans un métier où le coût matière fait l'essentiel du prix, le seul levier de marge vraiment durable est <b>le pouvoir d'achat</b>. Acheter deux fois plus de mémoire ne coûte pas deux fois plus cher : cela change la place dans la file d'attente du fournisseur et le prix obtenu. En période d'allocation, être un gros client n'est pas un confort, c'est une condition de survie.",
        "Le rachat de l'activité Home Networks à CommScope se lit d'abord comme ça : non pas acheter du chiffre d'affaires, mais acheter de la <b>masse d'achat</b> et un portefeuille d'opérateurs déjà certifiés. Les deux choses qui protègent dans ce métier.",
        "Corollaire utile en entretien : la consolidation du secteur n'est pas une mode financière, elle est une <b>réponse rationnelle à la structure de coûts</b>. C'est le type de raisonnement qu'on attend d'un profil Corporate Finance qui postule en contrôle de gestion."]],
      ["Où en est le choc des composants, à la veille de ton entretien",[
        "C'est l'élément le plus récent du dossier, et il s'est <b>aggravé</b> depuis ton premier entretien du 12 novembre. Les trois fabricants qui dominent la [[dram|mémoire]] — Samsung, SK Hynix et Micron — réorientent leur capacité vers les serveurs des centres de données d'intelligence artificielle, qui paient bien mieux qu'un fabricant d'électronique grand public.",
        "L'ordre de grandeur rapporté par la presse spécialisée donne la mesure du choc : le prix contractuel d'une puce DDR5 de 16 gigabits serait passé d'environ <b>8,70 dollars en octobre 2025 à près de 48 dollars en septembre 2026</b>. Cite-le comme un ordre de grandeur rapporté, pas comme une donnée que tu aurais vérifiée — devant un financier, cette prudence vaut mieux qu'une fausse assurance.",
        "Et le dirigeant de TeamGroup déclarait en novembre que <b>le pire reste à venir</b>, le point le plus tendu étant attendu entre le quatrième trimestre 2026 et le deuxième trimestre 2027. Autrement dit : la contrainte qui pèse sur les marges de Vantiva couvre exactement la durée de ton stage.",
        "Un exemple concret, et c'est celui qui fera mouche parce qu'il est vérifiable et français : <b>les Freebox Ultra livrées depuis fin août ne permettent plus de créer des machines virtuelles</b>. Free a retiré une fonction de sa box pour économiser de la mémoire. Voilà à quoi ressemble, chez l'abonné, une pénurie de composants."]],
      ["Ce que ça implique pour le poste, et ce que tu peux en dire",[
        "Trois conséquences s'enchaînent, et les énoncer dans cet ordre montre que tu raisonnes en contrôleur de gestion plutôt qu'en lecteur de presse.",
        "<b>Sur la marge :</b> les contrats signés avant la flambée portent un prix figé face à un coût qui a été multiplié. Chaque mois qui passe dégrade la marge des contrats anciens, et seule une renégociation ou une [[passthrough|répercussion]] l'arrête.",
        "<b>Sur la trésorerie :</b> en pénurie, les fabricants imposent des commandes fermes, longtemps à l'avance, parfois ni annulables ni retournables. Le stock gonfle au moment précis où l'entreprise s'est engagée sur un [[fcf|free cash flow]] positif. <b>C'est la tension centrale de l'année.</b>",
        "<b>Sur le produit :</b> on peut aussi redessiner — réduire la mémoire embarquée, simplifier des fonctions, revoir la nomenclature. C'est du <i>design-to-cost</i>, et cela se décide avec des chiffres que quelqu'un doit produire. L'exemple de la Freebox montre que cet arbitrage est déjà pris ailleurs.",
        "La phrase à placer, si l'occasion vient : <i>« Entre répercuter, absorber et redessiner le produit, les trois ont un coût, et aucun ne se tranche sans un chiffrage par produit et par client. »</i>"]],
      ["Les six vérités contre-intuitives",[
        "<b>Un.</b> Le chiffre d'affaires est décidé des années avant d'être facturé — il se gagne en appel d'offres, pas sur le marché.",
        "<b>Deux.</b> L'entreprise porte le risque de coût sans détenir le levier de prix : l'asymétrie est contractuelle, pas conjoncturelle.",
        "<b>Trois.</b> Un trimestre ne dit rien d'une tendance. La vidéo recule de 21,4 % sur neuf mois et monte de 25,2 % au trimestre.",
        "<b>Quatre.</b> Un recul aux Amériques peut être une transition de génération, pas une perte de clients. Les deux ne s'arbitrent pas pareil.",
        "<b>Cinq.</b> La marge et la trésorerie peuvent diverger violemment — et c'est la trésorerie qui tue.",
        "<b>Six.</b> La barrière à l'entrée n'est pas la technologie, c'est la certification déjà obtenue chez l'opérateur."]],
      ["Les chiffres à savoir par cœur",[
        "<b>436 M€</b> de chiffre d'affaires au troisième trimestre 2026, en recul de <b>7,3 %</b> (−7,0 % à changes constants). <b>1 170 M€</b> sur neuf mois, en recul de <b>12,1 %</b> (−8,3 % à changes constants).",
        "Au troisième trimestre : <b>Broadband −15,1 %</b>, <b>Video +25,2 %</b>. Sur neuf mois : Broadband −9,1 %, Video −21,4 %. Ne les inverse pas.",
        "Premier semestre 2026 : <b>734 M€</b> de chiffre d'affaires et <b>43 M€</b> d'EBITDA ajusté, contre 66 M€ un an plus tôt.",
        "Et la seule guidance : <b>free cash flow positif en 2026</b>, maintenue. Pas d'objectif d'EBITDA. Environ 13 000 collaborateurs, siège à Issy-les-Moulineaux, direction générale Lars Ihlen."]],
      ["La lecture d'un contrôleur de gestion",[

    metier:[
      ["Ce qu'on attend d'un stagiaire en contrôle de gestion",[
        "Sans romantisme, parce qu'il vaut mieux l'entendre maintenant qu'en janvier. Tu arrives après le budget : tu prendras le train en marche sur deux cycles, le <b>closing mensuel</b> et le <b>reforecast</b>.",
        "L'essentiel de tes journées sera de la <b>donnée</b> : extraire de l'outil de gestion, réconcilier, fiabiliser des fichiers, relancer les gens qui n'ont pas répondu. L'analyse est la plus petite part. Dis-le toi-même si on t'interroge sur tes attentes — un candidat qui annonce « je sais que c'est beaucoup de retraitement et ça ne me dérange pas » rassure bien plus qu'un candidat qui parle de recommandations stratégiques.",
        "On te jugera dans cet ordre : <b>la fiabilité</b>, tes chiffres tombent juste ; <b>le respect des dates</b>, un closing ne se décale pas ; <b>la capacité à expliquer un écart</b> au lieu de le constater ; et <b>le fait d'aller poser la question à l'opérationnel</b> plutôt que de supposer.",
        "Ce qui rend un stagiaire mémorable : automatiser un fichier récurrent et le documenter. Six mois après ton départ, l'équipe gagne encore du temps."]],
      ["Les trois états, et comment ils se tiennent",[
        "C'est l'exercice le plus classique de tous les entretiens de finance, et il tombe aussi en contrôle de gestion. Il faut pouvoir le dérouler sans hésiter.",
        "<b>Le compte de résultat</b> mesure la performance sur une période : chiffre d'affaires, moins les coûts, jusqu'au résultat net. <b>Le bilan</b> photographie une situation à une date : ce qu'on possède d'un côté, ce qu'on doit et ce qui appartient aux actionnaires de l'autre. <b>Le tableau de flux</b> explique le mouvement de trésorerie entre deux photographies, réparti en exploitation, investissement et financement.",
        "Les trois soudures à connaître. <b>Un :</b> le résultat net du compte de résultat alimente les capitaux propres au bilan, et constitue la première ligne du tableau de flux. <b>Deux :</b> la trésorerie finale du tableau de flux est exactement la ligne de trésorerie à l'actif du bilan. <b>Trois :</b> les variations de stocks, de créances clients et de dettes fournisseurs relient le bilan au tableau de flux par la variation du [[bfr|besoin en fonds de roulement]].",
        "<b>La règle qui sauve :</b> toute charge non décaissée — amortissement, provision — se soustrait au compte de résultat puis se rajoute dans le tableau de flux. Elle réduit le résultat et l'impôt, mais pas la trésorerie."]],
      ["L'exercice qui tombe : « une charge augmente de 100, que se passe-t-il ? »",[
        "On te donne une variation et tu dois dérouler les trois états. Méthode : <b>résultat, puis trésorerie, puis bilan</b>, dans cet ordre, à voix haute.",
        "Prenons l'amortissement, le cas d'école. <b>Amortissement +100, impôt à 25 %.</b>",
        "<b>Compte de résultat :</b> le résultat d'exploitation baisse de 100, l'impôt baisse de 25, le résultat net baisse de <b>75</b>.",
        "<b>Tableau de flux :</b> on part du résultat net à −75, on rajoute les 100 d'amortissement qui n'ont rien décaissé. La trésorerie d'exploitation monte donc de <b>+25</b> — exactement l'économie d'impôt.",
        "<b>Bilan :</b> la trésorerie monte de 25, les immobilisations baissent de 100, soit un actif en baisse de 75 ; au passif, les capitaux propres baissent de 75 par le résultat. L'équilibre tient.",
        "<b>La morale, et c'est elle qu'on veut t'entendre dire :</b> une charge qui ne décaisse rien <i>augmente</i> la trésorerie, par l'économie d'impôt qu'elle procure. Si tu sais faire tourner ce raisonnement sur l'amortissement, tu sauras le faire sur une provision ou une dépréciation."]],
      ["L'exercice maison : le bridge",[
        "C'est le livrable emblématique du contrôle de gestion, et c'est celui qu'on te demandera de produire. Expliquer <b>pourquoi</b> on passe de 100 à 92, en décomposant l'écart en effets séparés et additifs.",
        "Les quatre effets classiques sur le chiffre d'affaires. <b>Volume :</b> on a vendu moins d'unités, à prix et mix inchangés. <b>Prix :</b> on a vendu au même nombre d'unités mais moins cher. <b>Mix :</b> on a vendu autant, au même prix catalogue, mais davantage de produits bon marché. <b>Change :</b> la devise a bougé.",
        "La règle de calcul : on fait varier <b>un seul facteur à la fois</b>, les autres figés à leur valeur de référence. Effet volume = (volume N − volume N−1) × prix N−1. Effet prix = (prix N − prix N−1) × volume N. La somme des effets doit retomber exactement sur l'écart total — si elle ne tombe pas, il manque un effet.",
        "Sur la marge, on ajoute l'<b>effet coût matière</b>, et c'est le plus important chez Vantiva : (coût N − coût N−1) × volume N. C'est lui qui portera la hausse de la mémoire.",
        "Si on te demande comment tu t'y prendrais, réponds par cette décomposition. C'est la réponse d'un praticien, pas d'un étudiant."]],
      ["Les ratios qu'on peut te demander de calculer de tête",[
        "<b>Marge brute</b> = (chiffre d'affaires − coût des ventes) / chiffre d'affaires. Chez un fabricant de CPE, elle est basse par construction.",
        "<b>Rotation des stocks</b> = coût des ventes / stock moyen. Et sa version parlante, la <b>couverture en jours</b> = stock / coût des ventes × 365. C'est le chiffre qu'on suit en pénurie.",
        "<b>Délai clients</b> = créances clients / chiffre d'affaires × 365. <b>Délai fournisseurs</b> = dettes fournisseurs / achats × 365.",
        "<b>Cycle de trésorerie</b> = jours de stock + délai clients − délai fournisseurs. C'est le nombre de jours pendant lesquels l'entreprise avance l'argent.",
        "<b>Et le calcul à faire avant d'entrer :</b> 1 170 M€ de chiffre d'affaires sur neuf mois, soit environ <b>4,3 M€ par jour</b> (1 170 ÷ 273). Donc <b>un jour de délai de paiement vaut de l'ordre de 4 millions d'euros de trésorerie</b>. Savoir traduire un ratio en argent est exactement ce qu'on attend d'un contrôleur de gestion."]],
      ["Excel : ce qu'on vérifie vraiment",[
        "Personne ne te demandera une macro. On vérifie trois choses.",
        "<b>Les recherches.</b> <code>RECHERCHEX</code> si disponible, sinon <code>INDEX</code> + <code>EQUIV</code> — et savoir dire pourquoi on les préfère à <code>RECHERCHEV</code> : la colonne de retour peut être à gauche, et l'insertion d'une colonne ne casse pas la formule.",
        "<b>Les agrégations conditionnelles.</b> <code>SOMME.SI.ENS</code>, <code>NB.SI.ENS</code>, et les tableaux croisés dynamiques.",
        "<b>La robustesse.</b> Figer les références avec <code>$</code>, gérer les erreurs avec <code>SIERREUR</code>, séparer les hypothèses des calculs, et ne jamais écrire un nombre en dur dans une formule.",
        "Si on te demande ton niveau, ne réponds pas « avancé ». Raconte le modèle sectoriel que tu as construit à la Caisse des Dépôts et ce qu'il a produit : un niveau se prouve par un livrable."]]
