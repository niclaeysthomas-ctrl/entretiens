const GLOSSAIRE = {
  prudentiel:{t:"Supervision prudentielle", d:`
    <p>« Prudentiel » veut dire : qui sert à éviter la faillite. Une banque prête de l'argent qu'elle ne possède pas — elle le doit à ses déposants. Si elle prête trop, ou trop mal, elle tombe, et les déposants avec elle. La supervision prudentielle, c'est la surveillance publique qui vérifie en permanence qu'une banque reste capable de tenir ses engagements.</p>
    <p>Concrètement, un superviseur contrôle trois choses : les <b>fonds propres</b> (l'argent qui appartient vraiment à la banque et qui absorbe les pertes), la <b>liquidité</b> (sa capacité à rendre l'argent tout de suite si beaucoup de clients le réclament en même temps), et la <b>qualité des risques</b> pris (à qui elle prête, et avec quelles garanties).</p>
    <p>Le superviseur a de vrais pouvoirs : exiger plus de fonds propres, interdire une opération, retirer un agrément. C'est pour ça qu'un rachat de banque prend des mois : il faut son feu vert.</p>
    <p>En France, c'est l'[[acpr|ACPR]] ; pour les plus grandes banques de la zone euro, c'est la Banque centrale européenne.</p>`},
  acpr:{t:"ACPR", d:`
    <p>Autorité de contrôle prudentiel et de résolution. C'est le gendarme des banques et des assurances en France, adossé à la Banque de France.</p>
    <p>Deux missions dans son nom. <b>Contrôle prudentiel</b> : elle surveille la solidité des établissements (voir [[prudentiel|supervision prudentielle]]). <b>Résolution</b> : elle prépare et organise ce qu'on fait d'une banque qui tombe, pour que ça ne contamine pas le reste et que l'État n'ait pas à payer.</p>
    <p>Elle produit des rapports de contrôle sur chaque établissement : constats, demandes de correction, délais. C'est exactement ce type de document que tu as dépouillé à la Caisse des Dépôts — et en entretien, le dire suffit : ça prouve que tu as déjà vu de l'intérieur à quoi ressemble la régulation bancaire.</p>`},
  "fonds-epargne":{t:"Le Fonds d'épargne", d:`
    <p>Un circuit financier géré par la Caisse des Dépôts, et l'un des plus gros d'Europe : plus de 400 milliards d'euros.</p>
    <p>Le principe : quand tu déposes de l'argent sur un [[livret|Livret A]], ta banque n'en garde qu'une partie. Une fraction importante est <b>centralisée</b>, c'est-à-dire envoyée à la Caisse des Dépôts, qui la réunit dans le Fonds d'épargne.</p>
    <p>Cet argent sert ensuite à prêter très long — jusqu'à quarante ou soixante ans — pour le <b>logement social</b> et les équipements publics. Aucune banque privée ne prête sur ces durées ; le Fonds d'épargne le peut parce que l'encours des livrets, lui, ne disparaît jamais vraiment.</p>
    <p>C'est pour ça que ton stage parle directement à la Caisse d'Épargne : elle collecte en amont, le Fonds d'épargne redistribue en aval, et les bailleurs sociaux du groupe (Sia Habitat, SIGH, Hosmia) empruntent justement de ce côté-là.</p>`},
  livret:{t:"Épargne réglementée et Livret A", d:`
    <p>« Réglementée » signifie que ce n'est pas la banque qui fixe les règles, mais l'État : le taux, le plafond, l'absence d'impôt. Livret A, LDDS, LEP fonctionnent ainsi.</p>
    <p>L'épargnant y gagne un placement sans risque et disponible. L'État y gagne un réservoir d'argent stable qu'il oriente vers l'intérêt général. La banque, elle, perçoit une commission pour la part qu'elle centralise.</p>
    <p>Le Livret A est le produit historique des Caisses d'Épargne — c'est leur métier d'origine, et c'est pour ça que l'enseigne s'appelle ainsi.</p>`},
  "marque-groupe":{t:"CENORBANK Group : un nom, pas une société", d:`
    <p>Personne n'a fondé CENORBANK. C'est un <b>nom collectif inventé en mars 2026</b> et posé par-dessus des sociétés qui existaient déjà.</p>
    <p>Depuis 2014, la Caisse d'Épargne Hauts-de-France achète et crée des sociétés hors de France : le corporate belge en 2014, les Pays-Bas en 2024, [[banque-privee|Nagelmackers]] en mars 2025, Van Lys Bank — plus, en France, l'immobilier, le logement social et le private equity. Chacune avec son nom et son pays. Au bout de douze ans, cet ensemble n'avait pas de nom.</p>
    <p>Et il avait un problème : « Caisse d'Épargne Hauts-de-France » est inutilisable à l'étranger. Pour un dirigeant belge ou néerlandais, cela ne veut rien dire, et cela sonne comme une petite banque locale — l'inverse de ce qu'on veut projeter quand on vient de racheter une banque privée fondée en 1747. D'où le nom fabriqué : <b>CE</b> pour Caisse d'Épargne, <b>NOR</b> pour le Nord et l'Europe du Nord, <b>BANK</b> parce que c'est le même mot partout.</p>
    <p><b>La caisse régionale n'a pas changé de nom.</b> Elle s'appelle toujours Caisse d'Épargne Hauts-de-France sur la devanture des 283 agences. CENORBANK est une <b>marque institutionnelle</b> : investisseurs, clients entreprises, contreparties étrangères, recrutement. C'est pour ça que l'objet du mail de Mathilde Godefroy dit « CENORBANK » alors que son adresse est @hdf.caisse-epargne.fr.</p>
    <p>Qui possède quoi : les [[part-sociale|sociétaires]] possèdent la Caisse d'Épargne Hauts-de-France, et c'est elle qui possède tout le reste.</p>
    <p><b>Le piège :</b> ne dis pas « CENORBANK a racheté Nagelmackers ». C'est la Caisse d'Épargne Hauts-de-France qui l'a fait, en mars 2025 — un an avant que la marque existe.</p>`},
  "part-sociale":{t:"Part sociale et action : la vraie différence", d:`
    <p>Les deux représentent de l'argent apporté et un morceau de propriété. Trois choses changent tout.</p>
    <p><b>1. La valeur ne bouge pas.</b> Une action est un droit sur le patrimoine : si l'entreprise vaut plus, l'action vaut plus. Une part sociale est un <b>titre d'adhésion d'un montant fixe</b>, remboursé à ce même montant. Tu mets 20 €, tu récupères 20 €. Il n'existe pas de marché où la revendre : tu demandes à la coopérative de te la racheter, à sa valeur nominale.</p>
    <p>La banque, elle, s'enrichit bien — mais cette richesse part dans les [[reserves|réserves impartageables]]. La croissance a été <b>délibérément détachée du titre de propriété</b>. Une image : l'actionnaire possède une part du gâteau, donc si le gâteau double sa part double ; le sociétaire possède une carte de membre payée 20 € et remboursée 20 €, pendant que le gâteau appartient au club.</p>
    <p><b>2. Le pouvoir n'est pas proportionnel à l'argent.</b> Une personne, une voix — pas une action, une voix. Mille parts donnent une voix, comme une seule part. Il existe en outre des plafonds statutaires de détention.</p>
    <p><b>3. La rémunération est plafonnée.</b> Pas de dividende libre : un intérêt voté chaque année, proportionnel au nombre de parts mais limité par la loi, indexé sur un taux obligataire moyen. L'argent compte donc pour le rendement, jamais pour le pouvoir. Une part sociale ressemble davantage à un produit d'épargne qu'à un investissement.</p>
    <p>Conséquence directe : voir [[opa|pourquoi une coopérative est imprenable]].</p>`},
  reserves:{t:"Réserves impartageables", d:`
    <p>C'est le cœur du modèle coopératif, et la notion la moins connue.</p>
    <p>L'essentiel du résultat accumulé par une coopérative est mis en réserve, et cette réserve est <b>impartageable</b> : elle n'appartient à aucun sociétaire individuellement et ne peut être distribuée à personne. Ni par un vote, ni en cas de vente, ni même en cas de dissolution de l'établissement.</p>
    <p>Elle appartient à la coopérative elle-même et se transmet d'une génération de sociétaires à la suivante. Ce sont des réserves accumulées depuis le XIX<sup>e</sup> siècle qui financent aujourd'hui le rachat d'une banque belge.</p>
    <p>C'est ce qui explique l'horizon de décision : il n'y a personne à qui rendre cet argent, donc personne pour exiger qu'il rapporte vite.</p>`},
  opa:{t:"Pourquoi une coopérative est imprenable", d:`
    <p>Une OPA hostile, mécaniquement, c'est : acheter assez de droits de vote pour contrôler l'assemblée générale, puis changer le conseil et la direction. Sur une banque coopérative, les trois maillons sont cassés.</p>
    <p><b>Acheter ne donne pas de pouvoir.</b> Une personne, une voix : on peut détenir 90 % du capital et n'avoir qu'une seule voix. Le levier n'existe pas.</p>
    <p><b>On ne peut pas acheter.</b> Il n'y a pas de marché où ramasser des [[part-sociale|parts sociales]], et une cession est soumise à l'agrément de la coopérative. L'accumulation discrète est impossible.</p>
    <p><b>Il n'y aurait rien à gagner.</b> Même en raflant tout, les [[reserves|réserves impartageables]] le resteraient : impossible d'extraire la valeur accumulée. <b>Il n'y a pas de butin.</b></p>
    <p>Une offre hostile n'est donc pas seulement difficile, elle est <b>sans objet</b>. C'est ce qui permet à cette banque de se projeter à 2030 sans regarder son cours de Bourse — elle n'en a pas.</p>`},
  cooperative:{t:"Banque coopérative et sociétaires", d:`
    <p>Une banque coopérative n'a pas d'actionnaires. Elle appartient à ses <b>sociétaires</b> : des clients qui ont acheté des parts sociales. La Caisse d'Épargne Hauts-de-France en compte 420 000.</p>
    <p>La différence n'est pas cosmétique. Un actionnaire cherche une plus-value et un dividende croissant ; une part sociale, elle, ne monte pas en valeur — elle rapporte un intérêt plafonné. Et surtout la règle de vote est « une personne, une voix », pas « une action, une voix » : détenir mille parts ne donne pas mille voix.</p>
    <p>Conséquence stratégique, et c'est l'argument à tenir en entretien : <b>personne n'exige un résultat trimestriel en hausse</b>. La banque peut acheter une maison fondée en 1747 et mettre dix ans à l'intégrer. Un groupe coté ne le ferait pas de la même façon.</p>
    <p>Ne dis donc jamais « créer de la valeur pour l'actionnaire » en face d'eux : il n'y en a pas.</p>
    <p>Pour le détail : [[part-sociale|part sociale contre action]], [[reserves|les réserves impartageables]], [[opa|pourquoi c'est imprenable]].</p>`},
  bpce:{t:"Le groupe BPCE", d:`
    <p>Deuxième groupe bancaire français, né en 2009 de la fusion des organes centraux des Banques Populaires et des Caisses d'Épargne.</p>
    <p>Point important : BPCE n'est pas la maison mère au sens classique. Ce sont les <b>quinze Caisses d'Épargne régionales et les Banques Populaires qui détiennent BPCE</b>, et non l'inverse. L'organe central assure la solidarité financière, la liquidité et le respect de la réglementation ; chaque caisse régionale garde son autonomie de décision, son conseil et sa stratégie.</p>
    <p>C'est ce qui rend possible qu'une caisse régionale rachète seule une banque belge. Si tu dis « la Caisse d'Épargne » comme s'il s'agissait d'une entité nationale unique, tu te trompes de maison.</p>`},
  pnb:{t:"Produit net bancaire (PNB)", d:`
    <p>L'équivalent du chiffre d'affaires, mais pour une banque. On ne peut pas additionner bêtement les montants prêtés : ce n'est pas un revenu, c'est de l'argent qui repart.</p>
    <p>Le PNB additionne donc trois choses : la <b>marge d'intérêt</b> (ce que la banque encaisse sur ses prêts moins ce qu'elle paie sur les dépôts et ses propres emprunts), les <b>commissions</b> (tenue de compte, assurance, gestion de patrimoine), et les <b>gains sur ses activités de marché</b>.</p>
    <p>En anglais : <i>net banking income</i>. Le groupe CENORBANK a réalisé 865 M€ de PNB en 2025, dont 106 M€ à l'international.</p>`},
  rn:{t:"Résultat net", d:`
    <p>Ce qui reste à la fin : le [[pnb|PNB]] moins les charges d'exploitation (salaires, informatique, agences), moins le <b>coût du risque</b> — les provisions passées sur les crédits qu'on pense ne pas récupérer — moins l'impôt.</p>
    <p>Dans une banque, le coût du risque est la ligne qui fait basculer un exercice. Une année calme et un bon résultat ; une récession et des provisions qui doublent.</p>
    <p>Chez une coopérative, ce résultat n'est pas distribué à des actionnaires : il alimente les fonds propres, ce qui permet de prêter davantage l'année suivante.</p>`},
  "b-corp":{t:"Certification B Corp", d:`
    <p>Un label privé, décerné par l'ONG B Lab, qui évalue une entreprise sur son impact social et environnemental, sa gouvernance, son traitement des salariés et de ses clients.</p>
    <p>L'évaluation est chiffrée, il faut dépasser un seuil, et elle est à repasser tous les trois ans. Ce n'est pas une déclaration d'intention : c'est un audit avec un score.</p>
    <p>Pour une banque coopérative, c'est une manière de rendre vérifiable un discours que tout le monde tient. En entretien, c'est une bonne porte d'entrée si tu veux parler de ton modèle Net Zero.</p>`},
  opas:{t:"OPAS — offre publique d'achat simplifiée", d:`
    <p>Une offre publique d'achat, c'est quand quelqu'un propose publiquement de racheter les actions d'une société cotée, à un prix annoncé, pendant une période ouverte à tous.</p>
    <p>Elle est <b>simplifiée</b> quand l'initiateur contrôle déjà la société — il ne cherche pas à en prendre le contrôle, seulement à ramasser le flottant restant. La procédure est allégée et plus courte.</p>
    <p>Chez Altur : en janvier 2024, Suffren Holding, la holding de la famille Lombard, a offert 11 € par action pour les 10,48 % qu'elle ne détenait pas, puis a enchaîné sur un [[retrait|retrait obligatoire]].</p>`},
  retrait:{t:"Retrait obligatoire", d:`
    <p>En anglais <i>squeeze-out</i>. Quand, à l'issue d'une offre, il reste moins de 10 % du capital entre les mains des actionnaires minoritaires, l'initiateur peut exiger de racheter ce reliquat <b>même contre leur volonté</b>, au même prix que l'offre.</p>
    <p>C'est la dernière marche de la sortie de la Bourse : une fois le retrait réalisé, l'action cesse d'être cotée et la société redevient entièrement privée.</p>
    <p>Le but n'est pas de spolier qui que ce soit — le prix est contrôlé par l'AMF et un expert indépendant — mais d'éviter qu'une société reste cotée avec une poignée d'actionnaires, ce qui coûte cher en obligations de publication pour rien.</p>`},
  fpci:{t:"FPCI", d:`
    <p>Fonds professionnel de capital investissement. C'est le véhicule juridique français dans lequel on met l'argent destiné à acheter des parts de sociétés non cotées.</p>
    <p>« Professionnel » signifie qu'il est réservé à des investisseurs avertis — institutions, family offices, particuliers fortunés — avec un ticket d'entrée élevé. En contrepartie, la réglementation est plus légère que pour un fonds grand public.</p>
    <p>Un FPCI a une durée de vie finie, souvent dix ans : on lève l'argent, on investit pendant quatre ou cinq ans, on accompagne, puis on revend tout et on rend l'argent aux souscripteurs. Altur EdTrain est un FPCI.</p>`},
  closing:{t:"Closing, cible, hard cap", d:`
    <p>Lever un fonds ne se fait pas en une fois. Le <b>premier closing</b> est le moment où l'on a réuni assez d'engagements pour commencer à investir, sans attendre d'avoir tout collecté. On continue ensuite à lever pendant un an ou deux.</p>
    <p>La <b>cible</b> est le montant visé. Le <b>hard cap</b> est le plafond absolu : au-delà, on refuse l'argent, parce qu'un fonds trop gros pour sa stratégie serait contraint de faire des opérations plus grosses que ce qu'il sait faire.</p>
    <p>Altur EdTrain : premier closing à 10 M€, cible 30 M€, hard cap 50 M€.</p>`},
  lbo:{t:"LBO", d:`
    <p><i>Leveraged buy-out</i> : rachat avec effet de levier. On crée une société holding qui emprunte une grosse partie du prix, et c'est cette holding qui achète l'entreprise cible.</p>
    <p>La dette est ensuite remboursée par les bénéfices que l'entreprise rachetée remonte à la holding. L'investisseur n'a donc mis qu'une fraction du prix en argent propre, ce qui démultiplie son rendement si tout se passe bien — et ses pertes sinon.</p>
    <p>Le point de vigilance, c'est que l'entreprise doit générer un cash-flow régulier et prévisible pour tenir l'échéancier. D'où l'attrait du PE pour les activités à revenus récurrents, comme la formation.</p>`},
  mbo:{t:"MBO", d:`
    <p><i>Management buy-out</i> : un LBO dans lequel ce sont les <b>dirigeants en place</b> qui rachètent leur propre entreprise, avec l'appui financier d'un fonds.</p>
    <p>C'est souvent la solution d'une transmission : le fondateur veut sortir, l'équipe connaît la maison, le fonds apporte l'argent et la discipline. ArtFX, chez Altur, est un MBO.</p>`},
  buildup:{t:"Build-up", d:`
    <p>Stratégie qui consiste à acheter une première société — la « plateforme » — puis à lui faire racheter des concurrents ou des métiers voisins pour construire un ensemble plus gros.</p>
    <p>L'intérêt est double. Opérationnel : on mutualise les achats, les fonctions support, la force commerciale. Financier : un petit groupe se valorise à un multiple plus faible qu'un grand, donc en additionnant des petits on crée mécaniquement de la valeur à la revente.</p>
    <p>C'est exactement le modèle d'<b>Alfeor</b> dans le nucléaire, et celui d'Eléas chez Altur.</p>`},
  lp:{t:"LP, co-investissement, fonds sponsorisé", d:`
    <p><b>LP</b> veut dire <i>limited partner</i> : l'investisseur qui met de l'argent dans le fonds de quelqu'un d'autre et n'intervient pas dans les décisions. Celui qui gère, lui, est le <i>general partner</i>.</p>
    <p><b>Co-investissement</b> : au lieu de passer seulement par le fonds, on met aussi de l'argent directement dans une opération précise, aux côtés du gérant. Moins de frais, mais il faut savoir juger le dossier soi-même.</p>
    <p><b>Fonds sponsorisé</b> : on apporte sa marque, son réseau et une part de l'argent à une équipe de gestion, qui lève le reste auprès de tiers.</p>
    <p>Les quatre axes d'Altur sont là : LP, co-investissement, investissement direct, fonds sponsorisé.</p>`},
  dd:{t:"Due diligence", d:`
    <p>L'enquête menée avant d'acheter. On ouvre les comptes, les contrats, les contentieux, les contrats de travail, les assurances, l'outil informatique, et on vérifie que la réalité correspond à ce que le vendeur raconte.</p>
    <p>Elle se découpe par métier : financière, juridique, fiscale, sociale, technique, et de plus en plus environnementale. Chacune peut faire baisser le prix, ajouter une garantie au contrat, ou faire renoncer à l'opération.</p>
    <p>C'est le point où ton passage en audit interne est un atout direct : la méthode est la même — remonter du chiffre déclaré à la pièce qui le justifie.</p>`},
  pmi:{t:"Intégration post-acquisition", d:`
    <p><i>Post-merger integration</i>. C'est ce qui se passe après la signature, et c'est là que la plupart des opérations réussissent ou échouent.</p>
    <p>Il faut fusionner des plans comptables, des systèmes informatiques, des grilles de rémunération, des cultures de travail — et le faire sans faire fuir les clients ni les équipes qui font la valeur de la cible.</p>
    <p>Pour une banque privée comme Nagelmackers, dont l'actif est la confiance de 110 000 clients, c'est particulièrement délicat : intégrer trop vite détruit précisément ce qu'on a acheté. C'est un très bon sujet de question à poser en entretien.</p>`},
  sfdr:{t:"Article 8 SFDR", d:`
    <p>SFDR est le règlement européen qui oblige les fonds à dire ce qu'ils font vraiment en matière de durabilité, pour limiter le <i>greenwashing</i>.</p>
    <p>Il classe les fonds en trois familles : <b>article 6</b>, pas d'objectif durable particulier ; <b>article 8</b>, le fonds promeut des caractéristiques environnementales ou sociales et doit le documenter ; <b>article 9</b>, la durabilité est l'objectif même du fonds, et les exigences sont les plus lourdes.</p>
    <p>Altur EdTrain est classé article 8.</p>`},
  b150:{t:"Le 150-0 B ter", d:`
    <p>Un article du code général des impôts, souvent appelé « apport-cession ».</p>
    <p>Le mécanisme : un entrepreneur qui vend sa société apporte d'abord ses titres à une holding qu'il contrôle, ce qui met l'impôt sur la plus-value en attente. Pour que ce report dure, il doit <b>réinvestir une part du produit de la vente dans une activité économique</b> dans un délai fixé — et un FPCI éligible compte comme réinvestissement.</p>
    <p>C'est pour cela que les fonds mettent cette éligibilité en avant : elle leur ouvre l'argent des entrepreneurs qui viennent de vendre.</p>`},
  anr:{t:"Actif net réévalué (ANR)", d:`
    <p>La mesure de ce que vaut une société d'investissement. On réestime chaque participation à sa valeur du moment — et non à son prix d'achat — on additionne, on retranche les dettes, et on divise par le nombre d'actions.</p>
    <p>C'est l'indicateur que publient les véhicules cotés comme l'était Altur, parce que leur cours de Bourse ne dit rien d'utile : il reflète surtout la liquidité du titre.</p>
    <p>En anglais : <i>net asset value</i>, NAV.</p>`},
  fo:{t:"Family office", d:`
    <p>La structure qui gère le patrimoine d'une famille fortunée : placements, immobilier, participations dans des entreprises, transmission, fiscalité.</p>
    <p>On parle de <i>single family office</i> quand elle ne sert qu'une seule famille — c'est ce que revendique Altur depuis sa sortie de la cote — et de <i>multi family office</i> quand elle en sert plusieurs.</p>
    <p>La conséquence pratique : l'horizon d'investissement est celui d'une famille, pas celui d'un fonds qui doit rendre l'argent au bout de dix ans.</p>`},
  aum:{t:"Actifs sous gestion", d:`
    <p><i>Assets under management</i>, AuM. Le montant total que des clients confient à un gérant. Ce n'est <b>pas</b> l'argent du gérant : c'est celui des clients, dont il tire des commissions proportionnelles.</p>
    <p>C'est l'indicateur de taille de la banque privée et de la gestion d'actifs. Nagelmackers : 4,9 milliards d'euros pour 110 000 clients.</p>`},
  "banque-privee":{t:"Banque privée", d:`
    <p>Le métier qui consiste à gérer le patrimoine de clients fortunés : placements financiers, immobilier, crédit, structuration de la transmission, parfois philanthropie.</p>
    <p>Ce métier plaît aux banques parce qu'il consomme peu de fonds propres et rapporte des <b>commissions récurrentes</b> — à la différence du crédit, qui immobilise du capital. D'où l'attrait de Nagelmackers.</p>`},
  bom:{t:"Coût matière (BOM)", d:`
    <p><i>Bill of materials</i> : la nomenclature d'un produit, c'est-à-dire la liste de tous les composants qui entrent dedans, chacun avec son prix. Le coût matière est leur somme.</p>
    <p>Dans l'électronique grand public, le coût matière représente souvent <b>70 à 85 % du prix de vente</b>. C'est le chiffre qui commande tout : la main-d'œuvre, l'usine et la R&amp;D pèsent peu à côté. Quand un composant prend 30 %, il n'y a nulle part où aller chercher la différence — sauf dans le prix.</p>
    <p>C'est pour ça qu'un contrôleur de gestion dans ce métier passe son temps sur la nomenclature, pas sur les frais généraux.</p>`},
  dram:{t:"Mémoire DRAM et NAND", d:`
    <p>Deux familles de puces mémoire. La <b>DRAM</b> est la mémoire vive, rapide et volatile : elle s'efface à l'extinction. La <b>NAND</b> est la mémoire de stockage, plus lente mais persistante — celle d'une clé USB.</p>
    <p>Une box internet ou un décodeur en contient toujours : il faut de la DRAM pour faire tourner le logiciel et de la NAND pour le stocker.</p>
    <p>Leur particularité économique : c'est un marché <b>cyclique et concentré</b>, dominé par une poignée de fabricants, où le prix peut doubler ou s'effondrer en quelques trimestres selon que la capacité des usines suit ou non la demande. Et ces usines servent d'abord les clients les plus rémunérateurs. Quand une vague de demande arrive d'un autre secteur, les fabricants d'équipements grand public se retrouvent à la fois <b>moins bien servis et plus chers</b>. C'est la contrainte que Vantiva nomme explicitement.</p>`},
  rfq:{t:"Appel d'offres opérateur", d:`
    <p>Un opérateur n'achète pas des box au coup par coup : il lance un appel d'offres pour un modèle donné, sur un volume annuel et une durée de un à trois ans, et retient un ou deux fournisseurs.</p>
    <p>Trois conséquences qui structurent tout le métier. <b>Le prix est fixé à l'avance</b>, souvent avant que les composants soient achetés. <b>Gagner ou perdre un appel d'offres déplace des dizaines de millions</b> d'un coup : il n'y a pas de clientèle diffuse qui amortit. Et <b>le carnet est visible longtemps à l'avance</b>, ce qui rend la prévision possible — mais seulement si l'opérateur tient son calendrier.</p>`},
  passthrough:{t:"Répercussion du coût (pass-through)", d:`
    <p>La clause, ou la négociation, qui permet de reporter sur le client une hausse du coût des composants.</p>
    <p>Elle est au cœur du métier parce que le prix a été fixé avant l'achat des composants (voir [[rfq|appel d'offres]]). Sans répercussion, toute hausse du [[bom|coût matière]] sort directement de la marge. Avec, elle est transférée — au risque que l'opérateur réduise ses volumes ou aille voir ailleurs au renouvellement.</p>
    <p><b>C'est un arbitrage, pas une formule</b>, et c'est le contrôle de gestion qui l'éclaire : combien coûte la hausse par produit et par client, qu'autorise le contrat, quel volume perd-on si on répercute. Vantiva le fait déjà sur ses produits vidéo en Eurasie.</p>`},
  bfr:{t:"Besoin en fonds de roulement", d:`
    <p>L'argent immobilisé par le simple fait de faire tourner l'activité : <b>stocks</b> + <b>ce que les clients doivent</b> − <b>ce qu'on doit aux fournisseurs</b>.</p>
    <p>Un industriel achète ses composants, les stocke, fabrique, livre, puis attend soixante ou quatre-vingt-dix jours d'être payé. Pendant tout ce temps, il a avancé l'argent. Plus les délais s'allongent ou les stocks gonflent, plus il faut de trésorerie pour produire le même chiffre d'affaires.</p>
    <p>En période de pénurie de composants, la tentation est d'acheter d'avance pour sécuriser l'approvisionnement — ce qui gonfle le stock, donc le besoin en fonds de roulement, donc consomme du cash. <b>C'est l'arbitrage central</b> quand l'entreprise s'est engagée sur son [[fcf|free cash flow]].</p>`},
  fcf:{t:"Free cash flow", d:`
    <p>La trésorerie qui reste réellement disponible une fois l'activité financée : le cash dégagé par l'exploitation, moins les investissements.</p>
    <p>Il diffère du résultat comptable sur un point décisif : <b>il ne se laisse pas arranger</b>. On peut lisser un résultat par des provisions ou des amortissements ; on ne peut pas inventer du cash. C'est pour cela qu'une direction qui traverse une zone d'incertitude préfère souvent s'engager là-dessus plutôt que sur une marge.</p>
    <p>Conséquence pratique : si le free cash flow est la promesse, alors les stocks, les délais de paiement et le [[bfr|besoin en fonds de roulement]] deviennent les indicateurs que le contrôle de gestion suit en premier — avant même la marge.</p>`},
  ott:{t:"OTT et la fin du décodeur", d:`
    <p><i>Over-the-top</i> : un service vidéo qui passe par l'internet ouvert, sans que l'opérateur ne contrôle le transport. Netflix, YouTube, Disney+.</p>
    <p>Pourquoi cela tue le décodeur : l'application du service s'installe directement dans le téléviseur connecté ou dans une clé à vingt euros. L'opérateur n'a plus besoin de fournir un boîtier dédié à chaque foyer, et un boîtier non fourni est un boîtier non commandé.</p>
    <p>C'est la pression structurelle sur l'activité Video de Vantiva — même si un trimestre peut rebondir quand un gros opérateur renouvelle son parc d'un coup.</p>`},
  docsis:{t:"DOCSIS, fibre, Wi-Fi : les cycles techniques", d:`
    <p>Trois normes qui rythment le marché du Broadband, parce que chaque nouvelle génération oblige à remplacer le matériel chez l'abonné.</p>
    <p><b>DOCSIS</b> est la norme qui fait passer internet sur le câble coaxial de la télévision — très répandue en Amérique du Nord. <b>FTTH</b> (<i>fiber to the home</i>) est la fibre jusqu'au logement, qui domine en Europe. <b>Wi-Fi 6, puis 7</b> concerne la diffusion à l'intérieur du domicile.</p>
    <p>Une transition de génération crée une vague de commandes, puis un creux une fois le parc équipé. C'est exactement ce que la direction décrit aux Amériques : une <b>transition de génération de produits</b> pendant laquelle les opérateurs attendent avant de commander.</p>`},
  odm:{t:"ODM, OEM et sous-traitance", d:`
    <p>Trois façons de fabriquer. L'<b>OEM</b> conçoit et vend sous sa marque, en sous-traitant l'assemblage. L'<b>ODM</b> conçoit <i>et</i> fabrique un produit qu'un autre vendra sous sa propre marque. Le simple sous-traitant, lui, exécute un plan qu'on lui donne.</p>
    <p>L'enjeu est la position dans la chaîne : plus on se contente d'assembler, plus on est interchangeable et plus la marge est mince. La valeur se loge dans la <b>conception</b>, le <b>logiciel embarqué</b> et la <b>certification</b> chez l'opérateur — ce qui coûte cher à refaire et retient donc le client.</p>`},
  "marge-brute":{t:"Marge brute", d:`
    <p>Le chiffre d'affaires moins le coût direct de ce qu'on a vendu — pour un industriel, essentiellement le [[bom|coût matière]] et la fabrication.</p>
    <p>Elle mesure ce que le produit rapporte avant les frais de structure : recherche, commerciaux, administration. Dans l'électronique CPE, elle est <b>structurellement basse</b>, souvent entre 15 et 25 %, parce que les composants dominent le coût et que les clients sont peu nombreux et puissants.</p>
    <p>D'où une règle de ce métier : <b>quelques points de coût matière font basculer un contrat de rentable à perdant</b>. C'est ce qui rend la prévision si sensible.</p>`},
  cpe:{t:"CPE", d:`
    <p><i>Customer Premises Equipment</i> : les équipements installés chez l'abonné. Box internet, passerelle Wi-Fi, répéteur, décodeur TV, objets connectés.</p>
    <p>Particularité du marché : le client final ne choisit pas et ne paie pas directement. C'est l'<b>opérateur</b> qui achète en volume et distribue. Quelques clients énormes, donc, des appels d'offres, une pression permanente sur les prix, et des volumes qui dépendent des cycles d'investissement des opérateurs.</p>
    <p>C'est le cœur de métier de Vantiva : environ 60 % broadband, 40 % vidéo.</p>`},
  fpa:{t:"FP&A — contrôle de gestion", d:`
    <p><i>Financial planning and analysis</i>. L'équipe qui construit le budget, le révise en cours d'année (<i>reforecast</i>), produit le reporting mensuel et explique les écarts entre ce qui était prévu et ce qui s'est passé.</p>
    <p>Différence avec la comptabilité : le comptable enregistre le passé et doit être exact ; le contrôleur de gestion éclaire l'avenir et doit être utile. Différence avec l'audit : l'audit vérifie, le FP&amp;A pilote.</p>
    <p>Chez Vantiva, l'exercice est rendu difficile par la volatilité du prix des composants mémoire : la marge prévue en janvier peut ne plus exister en juin.</p>`},
  ebitda:{t:"EBITDA et EBITDA ajusté", d:`
    <p>L'EBITDA est le résultat d'exploitation avant amortissements : grossièrement, ce que l'activité dégage en cash avant de tenir compte de l'usure des machines, des intérêts et de l'impôt. On l'utilise pour comparer des entreprises sans se laisser brouiller par leur dette ou leur fiscalité.</p>
    <p>« <b>Ajusté</b> » veut dire qu'on en a retiré des éléments jugés exceptionnels : coûts de restructuration, frais d'acquisition, litiges. C'est utile pour voir la performance courante — et c'est aussi la ligne où une direction financière peut embellir le tableau. Regarde toujours ce qui a été ajusté.</p>
    <p>Vantiva : 43 M€ d'EBITDA ajusté au premier semestre 2026, contre 66 M€ un an plus tôt.</p>`},
  mezz:{t:"Dette mezzanine", d:`
    <p>Un financement intermédiaire entre le prêt bancaire classique et le capital. En cas de faillite, le mezzaneur est remboursé <b>après</b> les banques mais <b>avant</b> les actionnaires.</p>
    <p>Comme il prend plus de risque, il est mieux payé : taux élevé, intérêts souvent capitalisés, et parfois un accès au capital par des bons de souscription.</p>
    <p>C'est ce qui permet de boucler un [[lbo|LBO]] quand les banques refusent de prêter davantage mais que l'acheteur ne veut pas diluer son capital. CENORBANK Mezzanine fait ce métier.</p>`},
  epr2:{t:"Le programme EPR2", d:`
    <p>En novembre 2021, la France annonce la construction de <b>six réacteurs EPR2</b>, par paires sur trois sites, avec l'étude de <b>huit de plus</b>. C'est le premier programme nucléaire neuf depuis des décennies.</p>
    <p>L'EPR2 est une version simplifiée de l'EPR de Flamanville : mêmes principes de sûreté, conception revue pour être <b>constructible en série</b> plutôt qu'en pièce unique. Tout l'enjeu industriel est là — fabriquer plusieurs fois la même chose, ce qui suppose des fournisseurs capables de tenir une cadence et une qualité constantes.</p>
    <p>Pour un équipementier, cela change la nature de la commande : on passe d'un chantier exceptionnel à une <b>série planifiée sur quinze ans</b>. C'est ce qui rend un projet comme Alfeor finançable.</p>`},
  carenage:{t:"Le grand carénage", d:`
    <p>Le programme d'EDF destiné à <b>prolonger la durée de vie du parc existant</b> au-delà de quarante ans : remplacement de gros composants, mises à niveau de sûreté, rénovation des installations.</p>
    <p>C'est, pour la filière, un marché plus immédiat que les réacteurs neufs : il tourne déjà, il concerne des dizaines de tranches, et il consomme exactement les mêmes métiers — chaudronnerie, robinetterie, tuyauterie, essais, traitement de surface.</p>
    <p>En entretien, c'est l'argument qui désamorce l'objection « et si l'EPR2 glisse ? » : <b>le carnet ne dépend pas que du neuf</b>.</p>`},
  qualification:{t:"La qualification nucléaire", d:`
    <p>Ce qui sépare une bonne PME mécanique d'un fournisseur du nucléaire. Une pièce destinée à une centrale n'est pas seulement conforme : elle doit être <b>démontrablement</b> conforme, pièce par pièce.</p>
    <p>Cela passe par des codes de conception et de fabrication propres au nucléaire — le <b>RCC-M</b> pour les composants mécaniques — et par une réglementation spécifique aux <b>équipements sous pression nucléaires</b>. Chaque pièce traîne derrière elle un dossier de fabrication : d'où vient l'acier, qui a soudé, quel contrôle a été fait, par qui, quand.</p>
    <p>Conséquence économique, et c'est le cœur du modèle : obtenir cette qualification prend des <b>années</b> et coûte cher. Une fois obtenue, elle protège mieux qu'un brevet — le donneur d'ordre ne change pas de fournisseur à la légère. <b>C'est l'actif réel qu'Alfeor achète</b> quand il rachète une PME.</p>`},
  transmission:{t:"Le mur de la transmission", d:`
    <p>Une grande partie du tissu industriel français est composée de PME fondées dans l'après-guerre ou les années 1970, détenues par une famille, dont le dirigeant approche de la retraite sans successeur.</p>
    <p>Pour le dirigeant, trois issues : vendre à un concurrent, vendre à un fonds, ou fermer. Beaucoup refusent le concurrent, qui déménagerait l'activité, et se méfient du fonds, qui revendra dans cinq ans.</p>
    <p>C'est précisément la faille dans laquelle s'engouffre un projet comme Alfeor, dont l'argument est : <b>on garde votre nom, votre site et votre autonomie</b>, et on vous apporte la taille. Delta Metal date de 1947, TSM de 1972 — ce ne sont pas des hasards.</p>`},
  multiple:{t:"L'arbitrage de multiple", d:`
    <p>Le moteur financier de tout [[buildup|build-up]], et il faut pouvoir l'expliquer en deux phrases.</p>
    <p>Une entreprise se valorise en multipliant son résultat d'exploitation par un coefficient. Ce coefficient dépend de la taille : une PME de 5 M€ de chiffre d'affaires se vend à un multiple bas, parce qu'elle est risquée, dépendante de son dirigeant et difficile à revendre. Un groupe de 100 M€ se vend à un multiple nettement plus élevé.</p>
    <p>Donc : acheter dix petites à bas multiple, les assembler, et l'ensemble vaut mécaniquement plus que la somme des parties — <b>avant même toute amélioration opérationnelle</b>. C'est l'arbitrage de multiple.</p>
    <p>Le piège est que ce raisonnement est purement financier. Il ne tient que si l'ensemble se comporte vraiment comme un groupe : comptes consolidés fiables, direction commune, [[synergies|synergies]] réelles. Sinon l'acheteur suivant ne paiera pas le multiple de groupe, et toute la valeur créée était imaginaire.</p>`},
  synergies:{t:"Synergies, et pourquoi elles déçoivent", d:`
    <p>Les gains attendus d'un rapprochement. On les classe en deux familles. <b>Coûts</b> : acheter l'acier ensemble, mutualiser la paie, la qualité, l'informatique. <b>Revenus</b> : vendre au client de l'un les produits de l'autre, ou répondre à un appel d'offres qu'aucune des deux n'aurait pu prendre seule.</p>
    <p>Les synergies de coûts se réalisent souvent, parce qu'elles dépendent de décisions internes. Les synergies de revenus déçoivent presque toujours, parce qu'elles dépendent du client — qui ne change pas ses habitudes d'achat parce que deux fournisseurs se sont mariés.</p>
    <p>Dire cela en entretien vaut mieux que de réciter la promesse : ça montre que tu distingues le plan de la réalité.</p>`},
  consolidation:{t:"La consolidation comptable", d:`
    <p>L'opération qui transforme cinq jeux de comptes en un seul. Ce n'est pas une addition : il faut <b>éliminer les opérations internes</b> — si une société du groupe vend à une autre, ce chiffre d'affaires n'existe pas pour le groupe — retraiter les écritures propres à chaque société, et aligner les méthodes.</p>
    <p>Dans un groupe bâti par rachats, le vrai travail est en amont : cinq PME indépendantes n'avaient aucune raison d'avoir le même plan comptable, la même façon de valoriser leurs stocks ou de reconnaître leur chiffre d'affaires sur un contrat long.</p>
    <p>C'est l'essentiel du quotidien d'une direction financière de groupe en construction — et c'est précisément ce qu'un stagiaire peut apprendre là où tout est à bâtir, plutôt que là où tout existe déjà.</p>`},
  covenant:{t:"Covenants bancaires", d:`
    <p>Les engagements chiffrés pris envers les banques qui financent les acquisitions. Le plus courant limite la <b>dette rapportée à l'EBITDA</b> : par exemple ne jamais dépasser trois fois et demie.</p>
    <p>Ils se testent à dates fixes. Les franchir, même temporairement, donne à la banque le droit d'exiger le remboursement immédiat — ce qui, en pratique, se négocie, mais à un prix.</p>
    <p>Pour un groupe qui enchaîne les rachats, ces ratios dictent le rythme : chaque acquisition ajoute de la dette et, avec un décalage, de l'EBITDA. <b>Suivre ce ratio et prévoir sa trajectoire fait partie du travail de la direction financière</b> — et c'est une excellente question à poser.</p>`},
  rang1:{t:"Équipementier de rang 1", d:`
    <p>Dans une filière industrielle, les fournisseurs sont classés par étages. Le <b>rang 1</b> livre directement le donneur d'ordre — EDF, Framatome, Airbus — et lui vend un sous-ensemble complet dont il assume la conception, la qualité et les délais. Le rang 2 et au-delà fournissent des pièces au rang 1.</p>
    <p>Passer du rang 2 au rang 1 change tout : marges supérieures, contrats pluriannuels, relation directe avec le client. Mais il faut la taille, les certifications et la capacité d'ingénierie pour porter la responsabilité de l'ensemble.</p>
    <p>C'est précisément le projet d'Alfeor : fédérer des PME de rang 2 pour fabriquer un rang 1 — « une sorte de Valeo du nucléaire ».</p>`},
  agrement:{t:"Agrément bancaire", d:`
    <p>L'autorisation d'exercer le métier de banque. Sans elle, il est interdit de recevoir des dépôts du public.</p>
    <p>Elle est délivrée par le superviseur (voir [[prudentiel|supervision prudentielle]]) après examen du capital, des dirigeants, du dispositif de contrôle interne et du plan d'affaires. Et elle n'est pas acquise : le superviseur peut la retirer.</p>
    <p>Elle est <b>attachée à l'établissement</b>, pas à son propriétaire : racheter une banque suppose donc l'accord du superviseur sur le nouvel actionnaire. C'est ce qui explique les six mois entre l'annonce du rachat de Nagelmackers et sa finalisation.</p>`},
  "small-cap":{t:"Small cap et capital-développement", d:`
    <p><b>Small cap</b> désigne les petites entreprises — chez Altur, de 2 à 20 M€ de chiffre d'affaires. Le marché y est moins concurrentiel qu'en large cap : moins de fonds en face, des prix d'entrée plus bas, mais un travail d'accompagnement bien plus lourd.</p>
    <p><b>Capital-développement</b> : on entre au capital d'une société déjà rentable pour financer sa croissance, souvent en minoritaire, sans dette d'acquisition massive. C'est le contraire du [[lbo|LBO]] de transmission, où l'on rachète pour prendre le contrôle.</p>`}
};

/* [[cle|texte]] devient un bouton ; [[cle]] affiche le titre du terme. */
function gl(t){
  return String(t).replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, k, lab) => {
    const e = GLOSSAIRE[k];
    if(!e) return lab || k;
    return `<button class="gterm" onclick="voirTerme('${k}')">${lab || e.t}<i>?</i></button>`;
  });
}
function voirTerme(k){
  const e = GLOSSAIRE[k]; if(!e) return;
  const d = document.getElementById("modal");
  d.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${e.t}">
      <div class="shead"><h2>${e.t}</h2><button class="x" onclick="fermerTerme()" aria-label="Fermer">✕</button></div>
      <div class="sbody">${gl(e.d)}</div></div>`;
  d.hidden = false; document.body.style.overflow = "hidden";
  d.onclick = ev => { if(ev.target === d) fermerTerme(); };
}
function fermerTerme(){ const d = document.getElementById("modal"); d.hidden = true; document.body.style.overflow = ""; }
addEventListener("keydown", e => { if(e.key === "Escape") fermerTerme(); });

/* ── état ───────────────────────────────────────────────────────── */
const SKEY = "entretiens:v1";
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(SKEY)) || {quiz:{}, lang:"fr"}; }catch(e){ return {quiz:{}, lang:"fr"}; } }
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }

let vue = "accueil", ouvert = null, onglet = "rdv";

/* ── dates ──────────────────────────────────────────────────────── */
function auj(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function quand(iv){
  const t = auj();
  if(iv.date === t) return "aujourd'hui";
  const j = new Date(iv.date+"T12:00:00"), n = new Date(t+"T12:00:00");
  const dd = Math.round((j-n)/864e5);
  if(dd === 1) return "demain";
  if(dd === -1) return "hier";
  if(dd < 0) return j.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  if(dd < 7) return j.toLocaleDateString("fr-FR",{weekday:"long"});
  return j.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
function passe(iv){ return Date.parse(iv.date+"T"+(iv.fin||iv.heure)+":00") < Date.now(); }
function compte(iv){
  const m = Math.round((Date.parse(iv.date+"T"+iv.heure+":00") - Date.now())/6e4);
  if(m < 0 || m > 2880) return null;
  if(m < 60) return "dans "+m+" min";
  const h = Math.floor(m/60);
  return h < 24 ? "dans "+h+" h"+(m%60 ? " "+String(m%60).padStart(2,"0") : "") : "dans "+Math.round(h/24)+" j";
}
const tri = () => DATA.slice().sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure));
const esc = t => String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ── rendu ──────────────────────────────────────────────────────── */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = vue === "accueil" ? accueil() : vue === "profil" ? profil() : fiche();
  document.getElementById("tabbar").innerHTML = barre();
  window.scrollTo(0, 0);
}

function barre(){
  const b = [["accueil","🗓","Entretiens"],["profil","👤","Mon profil"]];
  return b.map(([id,ic,l])=>`<button aria-pressed="${vue===id}" onclick="aller('${id}')"><span class="ic">${ic}</span>${l}</button>`).join("");
}

function accueil(){
  const L = tri();
  return `<header class="top">
      <div class="grow">
        <p class="eyebrow">Recherche de stage · ${L.filter(x=>!passe(x)).length} à venir</p>
        <h1>Les entretiens</h1>
      </div>
      <button class="tgl" onclick="theme()" aria-label="Changer de thème">◐</button>
    </header>
    <div class="list">${L.map(carte).join("")}</div>
    <footer>Fiches, questions et quiz préparés à partir des échanges par mail et de sources publiques.
      Les données restent sur cet appareil.</footer>`;
}

function carte(iv){
  const cd = compte(iv), fini = passe(iv), q = S.quiz[iv.id];
  return `<button class="ivcard ${fini?"done":""}" style="--c:${iv.couleur}" onclick="ouvrir('${iv.id}')">
    <div class="when">${quand(iv)} · ${iv.heure}</div>
    <div class="name">${esc(iv.nom)}</div>
    <div class="role">${esc(iv.poste)}</div>
    <div class="meta">
      ${fini ? `<span class="chip">passé</span>` : cd ? `<span class="chip cd">${cd}</span>` : ""}
      <span class="chip">${iv.format.startsWith("En présentiel") ? "présentiel" : "visio"}</span>
      ${q ? `<span class="chip ok">quiz ${q.bon}/${q.total}</span>` : `<span class="chip">quiz à faire</span>`}
    </div></button>`;
}

function ouvrir(id){ ouvert = DATA.find(x=>x.id===id); vue = "fiche"; onglet = "rdv"; render(); }
function aller(v){ vue = v; render(); }
function onglets(o){ onglet = o; render(); }
function theme(){
  const r = document.documentElement;
  const sombre = r.getAttribute("data-theme") === "dark" ||
    (!r.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme", sombre ? "light" : "dark");
  try{ localStorage.setItem("entretiens:theme", sombre ? "light" : "dark"); }catch(e){}
}

const ONGLETS = [["rdv","Le RDV"],["boite","La boîte"],["angles","Tes angles"],["pitch","Présentation"],["qa","Questions"],["poser","À poser"],["secteur","Le secteur"],["pieges","Pièges"],["quiz","Quiz"],["lex","Lexique"]];

function fiche(){
  const iv = ouvert;
  return `<header class="top" style="--c:${iv.couleur}">
      <div class="grow">
        <button class="back" onclick="aller('accueil')">← Tous les entretiens</button>
        <h1>${esc(iv.nom)}</h1>
        <p class="eyebrow" style="margin-top:7px">${esc(iv.poste)}</p>
      </div>
    </header>
    <nav class="secs" style="--c:${iv.couleur}">
      ${ONGLETS.filter(([id])=>id!=="secteur"||iv.secteur).map(([id,l])=>`<button aria-pressed="${onglet===id}" onclick="onglets('${id}')">${l}</button>`).join("")}
    </nav>
    <div class="panel" style="--c:${iv.couleur}">${panneau(iv)}</div>`;
}

function panneau(iv){
  const P = {
    rdv: () => `<div class="box">
        <dl>
          <dt>Quand</dt><dd><b>${quand(iv)} ${iv.heure}${iv.fin ? " – "+iv.fin : ""}</b>${compte(iv)?`<small>${compte(iv)}</small>`:""}</dd>
          <dt>Format</dt><dd><b>${esc(iv.format)}</b><small>${esc(iv.lieu)}</small></dd>
          <dt>Poste</dt><dd>${esc(iv.poste)}</dd>
        </dl></div>
      <p>${gl(iv.resume)}</p>
      ${iv.cle?`<div class="key"><span class="lab">À retenir avant tout</span>${gl(iv.cle)}</div>`:""}
      <h3>Qui tu as en face</h3>
      ${iv.gens.map(g=>`<div class="box"><div><b>${esc(g[0])}</b><br><span style="color:var(--c);font-size:14.5px;font-weight:600">${esc(g[1])}</span></div><p style="color:var(--muted);font-size:15.5px">${gl(g[2])}</p></div>`).join("")}`,
    boite: () => `${iv.figs?`<div class="figs">${iv.figs.map(f=>`<div><b>${f[0]}</b><small>${f[1]}</small></div>`).join("")}</div>`:""}
      <h3>Ce qu'elle est</h3>
      <ul>${iv.boite.map(x=>`<li>${gl(x)}</li>`).join("")}</ul>
      ${iv.histoire?`<h3>Son histoire récente</h3><div class="box hist">${iv.histoire.map(h=>`<div class="ev"><span class="yr">${h[0]}</span><div><b>${gl(h[1])}</b><small>${gl(h[2])}</small></div></div>`).join("")}</div>`:""}`,
    angles: () => `<ul>${iv.angles.map(x=>`<li>${gl(x)}</li>`).join("")}</ul>`,
    pitch: () => pitch(iv),
    qa: () => `<div class="qa">${iv.qa.map(x=>`<div><p class="q">${esc(x[0])}</p><p class="a">${gl(x[1])}</p></div>`).join("")}</div>`,
    poser: () => `<p>Quelques-unes suffisent. Elles doivent prouver que tu as compris le dossier.</p><ul>${iv.poser.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`,
    pieges: () => `<div class="box trap">${iv.pieges.map(x=>`<div>${gl(x)}</div>`).join("")}</div>`,
    quiz: () => quiz(iv),
    secteur: () => iv.secteur
      ? `<p>Comprendre le métier avant les chiffres. Les termes soulignés s'ouvrent.</p>` +
        iv.secteur.map(b=>`<h3>${esc(b[0])}</h3>` + b[1].map(p=>`<p>${gl(p)}</p>`).join("")).join("") +
        (iv.quizSec ? `<h3>Quiz du secteur</h3><p style="color:var(--muted);font-size:15px">Restituer, pas reconnaître : réponds avant de relire.</p>` + quizBloc(iv, "quizSec") : "")
      : `<p>Pas encore de masterclass pour ce secteur.</p>`,
    lex: () => lexique()
  };
  return (P[onglet] || P.rdv)();
}

function pitch(iv){
  const l = S.lang || "fr";
  const beats = SOCLE[l].concat([
    {t: l==="fr" ? "Trajectoire" : "Trajectory", s:"1:10", p: iv.traj[l] || iv.traj.fr},
    {t: l==="fr" ? "Demande" : "Ask", s:"1:50", p: l==="fr"
      ? ["« Je cherche un stage à partir de <span class='fill'>[ta date de début]</span>, et ce que je viens y apprendre, c'est l'exécution. Voilà pour l'essentiel — je suis à votre disposition pour entrer dans le détail. »"]
      : ["“I'm looking for an internship starting <span class='fill'>[your start date]</span>, and what I want to learn is execution. That's the short version; happy to go deeper wherever it's useful.”"]}
  ]);
  return `<div class="key"><span class="lab">La structure</span>
      <b>Ancrage → Preuve → Trajectoire → Demande.</b> D'où je viens · ce que j'ai déjà fait · pourquoi vous précisément · ce que je viens chercher.</div>
    <div class="langs">
      <button aria-pressed="${l==='fr'}" onclick="majLangue('fr')">FRANÇAIS</button>
      <button aria-pressed="${l==='en'}" onclick="majLangue('en')">ENGLISH</button>
    </div>
    <div class="box">${beats.map(b=>`<div class="beat"><div class="mk"><b>${b.t}</b><span>${b.s}</span></div>
      <div>${b.p.map(x=>`<p>${gl(x)}</p>`).join("")}</div></div>`).join("")}</div>
    <p style="color:var(--muted);font-size:15px"><i>Répète-la à voix haute deux fois. Lue dans la tête, elle ne tient pas en bouche.</i></p>`;
}
/* « lang » est une propriété de tout élément HTML : dans un attribut onclick,
   le navigateur résout button.lang (une chaîne vide) avant la fonction globale.
   D'où un nom qui n'entre en collision avec rien. */
function majLangue(l){ S.lang = l; save(); render(); }

function quiz(iv){ return quizBloc(iv, "quiz"); }
/* Une fiche peut porter plusieurs séries : celle de l'entreprise et celle
   du secteur. La clé de stockage les sépare, les scores ne se mélangent pas. */
function cleQuiz(id, champ){ return champ === "quiz" ? id : id + "|" + champ; }
function quizBloc(iv, champ){
  const Q = iv[champ], cle = cleQuiz(iv.id, champ);
  const r = (S.quiz[cle] && S.quiz[cle].rep) || {};
  const faits = Object.keys(r).length;
  const bons = Object.keys(r).filter(i => r[i] === Q[i][2]).length;
  return `<div class="score"><b>${bons}/${Q.length}</b>
      <div><small>${faits ? faits+" question"+(faits>1?"s":"")+" répondue"+(faits>1?"s":"") : "Pas encore commencé"}</small>
      <small>${bons === Q.length ? "Tu connais le dossier." : "Réponds, la correction s'affiche aussitôt."}</small></div>
      ${faits ? `<button class="reset" onclick="razQuiz('${cle}')">Recommencer</button>` : ""}</div>
    <div class="qz">${Q.map((q,i)=>{
      const rep = r[i];
      return `<div class="qblock"><div class="num">Question ${i+1}</div><div class="txt">${esc(q[0])}</div>
        <div class="opts">${q[1].map((o,j)=>{
          let cls = "";
          if(rep !== undefined) cls = j === q[2] ? " good" : (j === rep ? " bad" : "");
          return `<button class="opt${cls}" ${rep!==undefined?"disabled":""} onclick="rep('${iv.id}','${champ}',${i},${j})">${esc(o)}</button>`;
        }).join("")}</div>
        ${rep !== undefined ? `<p class="why">${esc(q[3])}</p>` : ""}</div>`;
    }).join("")}</div>`;
}
function rep(id, champ, i, j){
  const iv = DATA.find(x=>x.id===id), Q = iv[champ], cle = cleQuiz(id, champ);
  if(!S.quiz[cle]) S.quiz[cle] = {rep:{}, bon:0, total:Q.length};
  S.quiz[cle].rep[i] = j;
  S.quiz[cle].bon = Object.keys(S.quiz[cle].rep).filter(k => S.quiz[cle].rep[k] === Q[k][2]).length;
  save(); render();
}
function razQuiz(id){ delete S.quiz[id]; save(); render(); }


function lexique(){
  const cles = Object.keys(GLOSSAIRE).sort((a,b)=>GLOSSAIRE[a].t.localeCompare(GLOSSAIRE[b].t,"fr"));
  return `<p>Toutes les notions techniques employées dans les fiches. Touche un terme pour l'explication complète.</p>
    <div class="box"><ul>${cles.map(k=>`<li>${gl("[["+k+"]]")} <span style="color:var(--muted);font-size:14.5px">— ${esc(GLOSSAIRE[k].d.replace(/<[^>]+>/g," ").replace(/\[\[[a-z0-9-]+\|?([^\]]*)\]\]/g,"$1").replace(/\s+/g," ").trim().slice(0,95))}…</span></li>`).join("")}</ul></div>`;
}

function profil(){
  return `<header class="top">
      <div class="grow"><p class="eyebrow">Ce que tu peux dire de toi</p><h1>Mon profil</h1></div>
      <button class="tgl" onclick="theme()" aria-label="Changer de thème">◐</button>
    </header>
    <div class="box"><b>${MOI.nom}</b><small style="color:var(--muted)">Master in Management, ESCP Business School</small></div>
    <h2>Formation</h2>
    <div class="box cv">${MOI.formation.map(r=>`<div class="row"><span class="yr">${r[0]}</span><div><b>${r[1]}</b><small>${gl(r[2])}</small></div></div>`).join("")}</div>
    <h2>Expérience</h2>
    <div class="box cv">${MOI.exp.map(r=>`<div class="row"><span class="yr">${r[0]}</span><div><b>${r[1]}</b><small>${gl(r[2])}</small></div></div>`).join("")}</div>
    <h2>Le reste</h2>
    <div class="box"><ul>${MOI.autres.map(x=>`<li>${gl(x)}</li>`).join("")}</ul></div>
    <h2>Vocabulaire anglais</h2>
    <div class="box"><table class="gloss">
      <tr><td>épargne réglementée</td><td>regulated savings</td></tr>
      <tr><td>garantie d'emprunt</td><td>loan guarantee</td></tr>
      <tr><td>audit interne, mission d'audit</td><td>internal audit, audit engagement</td></tr>
      <tr><td>risque de continuité d'activité</td><td>business continuity risk</td></tr>
      <tr><td>contrôle de gestion</td><td>financial planning &amp; analysis</td></tr>
      <tr><td>produit net bancaire</td><td>net banking income</td></tr>
      <tr><td>rachat, opération finalisée</td><td>acquisition, deal completed</td></tr>
      <tr><td>intégration post-acquisition</td><td>post-merger integration</td></tr>
      <tr><td>sous-traitant de rang 1</td><td>tier-one supplier</td></tr>
      <tr><td>stage, stagiaire</td><td>internship, intern</td></tr>
    </table></div>
    <footer>Tiré de ton CV. Si tu le mets à jour, pense à corriger cette page.</footer>`;
}

/* ── démarrage ──────────────────────────────────────────────────── */
try{ const t = localStorage.getItem("entretiens:theme"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
render();
setInterval(() => { if(vue === "accueil") render(); }, 60000);
if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
