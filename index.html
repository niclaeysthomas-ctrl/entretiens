<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LES ENTRETIENS</title>
<meta name="theme-color" content="#11141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --paper:#f5f7f9; --card:#fff; --card2:#eef1f5; --ink:#161a21; --muted:#5c6474; --faint:#8b94a3;
    --line:#dce1e8; --line-soft:#e9edf2;
    --brick:#a8342a; --brick-soft:#f4e4e2;
    --canal:#245c69; --canal-soft:#e1eced;
    --gold:#8a5a10; --gold-soft:#f8eeda;
    --good:#1b7a4b; --good-soft:#e2f1e8;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --disp:"Bitter",Georgia,serif;
    --body:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0f1217; --card:#171b22; --card2:#1f242d; --ink:#e9edf3; --muted:#99a2b0; --faint:#6f7988;
      --line:#2a313b; --line-soft:#222932;
      --brick:#e4705f; --brick-soft:#331f1d;
      --canal:#74b8c6; --canal-soft:#152a2f;
      --gold:#e0ad5e; --gold-soft:#2d2517;
      --good:#58c68d; --good-soft:#15291f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f1217; --card:#171b22; --card2:#1f242d; --ink:#e9edf3; --muted:#99a2b0; --faint:#6f7988;
    --line:#2a313b; --line-soft:#222932;
    --brick:#e4705f; --brick-soft:#331f1d;
    --canal:#74b8c6; --canal-soft:#152a2f;
    --gold:#e0ad5e; --gold-soft:#2d2517;
    --good:#58c68d; --good-soft:#15291f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px calc(96px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:22px}
  button{font:inherit}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:0}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(25px,6.5vw,33px);line-height:1.1;letter-spacing:-.015em;margin:5px 0 0;text-wrap:balance}
  h2{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
  h3{font-weight:600;font-size:16px;margin:4px 0 -5px}
  p{margin:0}
  a{color:var(--brick)}

  header.top{display:flex;align-items:flex-start;gap:12px}
  header.top .grow{flex:1;min-width:0}
  .tgl{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--muted);cursor:pointer;font-size:16px}

  /* ── liste des entretiens ── */
  .list{display:flex;flex-direction:column;gap:10px}
  .ivcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--c,var(--brick));border-radius:5px;padding:15px 16px;cursor:pointer;color:inherit}
  .ivcard:focus-visible{outline:2px solid var(--c,var(--brick));outline-offset:2px}
  .ivcard .when{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--brick))}
  .ivcard .name{font-family:var(--disp);font-weight:700;font-size:19px;margin-top:3px;letter-spacing:-.01em}
  .ivcard .role{color:var(--muted);font-size:14.5px;margin-top:1px}
  .ivcard .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}
  .chip.cd{background:var(--brick-soft);color:var(--brick)}
  .chip.ok{background:var(--good-soft);color:var(--good)}
  .ivcard.done{opacity:.62}

  /* ── fiche ── */
  .back{align-self:flex-start;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:15px}
  nav.secs{display:flex;flex-wrap:wrap;gap:6px}
  nav.secs button{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;padding:6px 10px;border-radius:3px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
  nav.secs button[aria-pressed="true"]{background:var(--c,var(--brick));border-color:var(--c,var(--brick));color:#fff}

  .panel{display:flex;flex-direction:column;gap:14px}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 15px;align-items:baseline}
  dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  dd{margin:0;font-size:16px}
  dd small{display:block;color:var(--muted);font-size:14px;line-height:1.45}
  .box{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:16px;
    display:flex;flex-direction:column;gap:12px}
  .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .figs div{background:var(--card);padding:12px 13px}
  .figs b{display:block;font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .figs small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
  ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  ul li{position:relative;padding-left:16px}
  ul li::before{content:"";position:absolute;left:1px;top:.62em;width:5px;height:5px;border-radius:50%;
    background:var(--c,var(--brick));opacity:.75}
  .key{background:var(--canal-soft);border:1px solid color-mix(in srgb,var(--canal) 30%,transparent);
    border-radius:5px;padding:13px 15px;font-size:15.5px}
  .key .lab{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--canal);margin-bottom:5px}
  .warn{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
    border-radius:5px;padding:13px 15px;font-size:15.5px}
  .qa>div+div{margin-top:15px}
  .qa .q{font-weight:600;font-size:16.5px;margin-bottom:5px}
  .qa .q::before{content:"« ";color:var(--faint)} .qa .q::after{content:" »";color:var(--faint)}
  .qa .a{color:var(--muted);border-left:2px solid var(--line);padding-left:12px;font-size:16px}
  .qa .a b{color:var(--ink);font-weight:600}
  .trap div{padding:11px 0;font-size:15.5px;border-top:1px solid var(--line-soft)}
  .trap div:first-child{border-top:0;padding-top:0}
  .trap b{color:var(--brick);font-weight:600}

  /* ── pitch ── */
  .langs{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;align-self:flex-start}
  .langs button{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;padding:6px 13px;border:0;
    background:var(--card);color:var(--muted);cursor:pointer}
  .langs button+button{border-left:1px solid var(--line)}
  .langs button[aria-pressed="true"]{background:var(--c,var(--brick));color:#fff}
  .beat{display:grid;grid-template-columns:76px 1fr;gap:13px;padding-top:13px;margin-top:13px;border-top:1px solid var(--line-soft)}
  .beat:first-child{padding-top:0;margin-top:0;border-top:0}
  .beat .mk b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--c,var(--brick));font-weight:500}
  .beat .mk span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .beat p+p{margin-top:8px}
  .fill{background:var(--brick-soft);border-bottom:1px solid var(--brick);padding:0 3px;font-style:italic}

  /* ── quiz ── */
  .qz{display:flex;flex-direction:column;gap:16px}
  .qblock{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px}
  .qblock .num{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
  .qblock .txt{font-weight:600;margin:4px 0 11px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{text-align:left;width:100%;padding:10px 12px;border-radius:4px;border:1px solid var(--line);
    background:var(--card2);color:inherit;cursor:pointer;font-size:15.5px;line-height:1.4}
  .opt:focus-visible{outline:2px solid var(--c,var(--brick));outline-offset:2px}
  .opt.good{background:var(--good-soft);border-color:var(--good);color:var(--ink);font-weight:600}
  .opt.bad{background:var(--brick-soft);border-color:var(--brick);color:var(--ink)}
  .why{margin-top:10px;font-size:15px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
  .score{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:15px;
    display:flex;align-items:center;gap:14px}
  .score b{font-family:var(--disp);font-size:27px;font-variant-numeric:tabular-nums}
  .score small{color:var(--muted);font-size:14px;display:block}
  .reset{margin-left:auto;background:none;border:1px solid var(--line);border-radius:4px;color:var(--muted);
    padding:7px 11px;font-size:13.5px;cursor:pointer}

  /* ── profil ── */
  .cv{display:flex;flex-direction:column;gap:0}
  .cv .row{display:grid;grid-template-columns:96px 1fr;gap:13px;padding:12px 0;border-top:1px solid var(--line-soft)}
  .cv .row:first-child{border-top:0;padding-top:0}
  .cv .yr{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.04em}
  .cv b{font-weight:600}
  .cv small{display:block;color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:2px}
  table.gloss{width:100%;border-collapse:collapse;font-size:15px}
  table.gloss td{border-top:1px solid var(--line-soft);padding:7px 0;vertical-align:top}
  table.gloss tr:first-child td{border-top:0}
  table.gloss td:first-child{color:var(--muted);padding-right:14px;width:48%}
  table.gloss td:last-child{font-weight:600}

  /* ── barre du bas ── */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:7px 4px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;border-radius:9px}
  .tabbar button .ic{font-size:18px;line-height:1}
  .tabbar button[aria-pressed="true"]{color:var(--brick);background:var(--brick-soft)}
  footer{color:var(--faint);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      ["Quelle filière Alfeor sert-elle en priorité ?",["L'aéronautique","Le nucléaire","L'automobile","Le ferroviaire"],1,"La filière nucléaire française, avec EDF et Framatome comme donneurs d'ordre visés."],
      ["Quel est le modèle de croissance ?",["Croissance organique","Franchise","Buy-and-build : rachat et fédération de PME","Licences technologiques"],2,"Cinq acquisitions en moins de dix-huit mois."],
      ["Qui préside le conseil de surveillance ?",["Éric Druenne","Arnaud Montebourg","Julien Bourgeois","Édouard Sagon"],1,"Arnaud Montebourg, via Les Équipes du Made in France. Mais le directeur général est Éric Druenne."],
      ["Quel fonds accompagne Alfeor ?",["Otium Capital","Altur Investissement","Eurazeo","Tikehau"],0,"Otium Capital, aux côtés des Équipes du Made in France."],
      ["Laquelle de ces sociétés n'a PAS été acquise par Alfeor ?",["Delta Metal","Deltafluid","Les Ateliers de la Meuse","Deltalyo"],3,"TSM, Les Ateliers de la Meuse, Delta Metal, Deltafluid et le Laboratoire Effitech forment les cinq acquisitions."],
      ["Quelle comparaison le groupe revendique-t-il ?",["« Le Airbus du nucléaire »","« Une sorte de Valeo du nucléaire »","« Le Safran des PME »","« Le Michelin de l'atome »"],1,"Devenir un équipementier de rang 1, comme Valeo l'est pour l'automobile."],
      ["Quel est le poste de Julien Bourgeois ?",["Directeur des opérations","Directeur général","Directeur administratif et financier","Président du conseil de surveillance"],2,"DAF du groupe, avec un parcours audit et finance industrielle — ton meilleur point commun."]
    ]
  }
];

/* ── état ───────────────────────────────────────────────────────── */
const SKEY = "entretiens:v1";
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(SKEY)) || {quiz:{}, lang:"fr"}; }catch(e){ return {quiz:{}, lang:"fr"}; } }
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }

let vue = "accueil", ouvert = null, onglet = "rdv";

/* ── dates ──────────────────────────────────────────────────────── */
function auj(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function quand(iv){
  const t = auj();
  if(iv.date === t) return "aujourd'hui";
  const j = new Date(iv.date+"T12:00:00"), n = new Date(t+"T12:00:00");
  const dd = Math.round((j-n)/864e5);
  if(dd === 1) return "demain";
  if(dd === -1) return "hier";
  if(dd < 0) return j.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  if(dd < 7) return j.toLocaleDateString("fr-FR",{weekday:"long"});
  return j.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
function passe(iv){ return Date.parse(iv.date+"T"+(iv.fin||iv.heure)+":00") < Date.now(); }
function compte(iv){
  const m = Math.round((Date.parse(iv.date+"T"+iv.heure+":00") - Date.now())/6e4);
  if(m < 0 || m > 2880) return null;
  if(m < 60) return "dans "+m+" min";
  const h = Math.floor(m/60);
  return h < 24 ? "dans "+h+" h"+(m%60 ? " "+String(m%60).padStart(2,"0") : "") : "dans "+Math.round(h/24)+" j";
}
const tri = () => DATA.slice().sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure));
const esc = t => String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ── rendu ──────────────────────────────────────────────────────── */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = vue === "accueil" ? accueil() : vue === "profil" ? profil() : fiche();
  document.getElementById("tabbar").innerHTML = barre();
  window.scrollTo(0, 0);
}

function barre(){
  const b = [["accueil","🗓","Entretiens"],["profil","👤","Mon profil"]];
  return b.map(([id,ic,l])=>`<button aria-pressed="${vue===id}" onclick="aller('${id}')"><span class="ic">${ic}</span>${l}</button>`).join("");
}

function accueil(){
  const L = tri();
  return `<header class="top">
      <div class="grow">
        <p class="eyebrow">Recherche de stage · ${L.filter(x=>!passe(x)).length} à venir</p>
        <h1>Les entretiens</h1>
      </div>
      <button class="tgl" onclick="theme()" aria-label="Changer de thème">◐</button>
    </header>
    <div class="list">${L.map(carte).join("")}</div>
    <footer>Fiches, questions et quiz préparés à partir des échanges par mail et de sources publiques.
      Les données restent sur cet appareil.</footer>`;
}

function carte(iv){
  const cd = compte(iv), fini = passe(iv), q = S.quiz[iv.id];
  return `<button class="ivcard ${fini?"done":""}" style="--c:${iv.couleur}" onclick="ouvrir('${iv.id}')">
    <div class="when">${quand(iv)} · ${iv.heure}</div>
    <div class="name">${esc(iv.nom)}</div>
    <div class="role">${esc(iv.poste)}</div>
    <div class="meta">
      ${fini ? `<span class="chip">passé</span>` : cd ? `<span class="chip cd">${cd}</span>` : ""}
      <span class="chip">${iv.format.startsWith("En présentiel") ? "présentiel" : "visio"}</span>
      ${q ? `<span class="chip ok">quiz ${q.bon}/${q.total}</span>` : `<span class="chip">quiz à faire</span>`}
    </div></button>`;
}

function ouvrir(id){ ouvert = DATA.find(x=>x.id===id); vue = "fiche"; onglet = "rdv"; render(); }
function aller(v){ vue = v; render(); }
function onglets(o){ onglet = o; render(); }
function theme(){
  const r = document.documentElement;
  const sombre = r.getAttribute("data-theme") === "dark" ||
    (!r.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme", sombre ? "light" : "dark");
  try{ localStorage.setItem("entretiens:theme", sombre ? "light" : "dark"); }catch(e){}
}

const ONGLETS = [["rdv","Le RDV"],["boite","La boîte"],["angles","Tes angles"],["pitch","Présentation"],["qa","Questions"],["poser","À poser"],["pieges","Pièges"],["quiz","Quiz"]];

function fiche(){
  const iv = ouvert;
  return `<header class="top" style="--c:${iv.couleur}">
      <div class="grow">
        <button class="back" onclick="aller('accueil')">← Tous les entretiens</button>
        <h1>${esc(iv.nom)}</h1>
        <p class="eyebrow" style="margin-top:7px">${esc(iv.poste)}</p>
      </div>
    </header>
    <nav class="secs" style="--c:${iv.couleur}">
      ${ONGLETS.map(([id,l])=>`<button aria-pressed="${onglet===id}" onclick="onglets('${id}')">${l}</button>`).join("")}
    </nav>
    <div class="panel" style="--c:${iv.couleur}">${panneau(iv)}</div>`;
}

function panneau(iv){
  const P = {
    rdv: () => `<div class="box">
        <dl>
          <dt>Quand</dt><dd><b>${quand(iv)} ${iv.heure}${iv.fin ? " – "+iv.fin : ""}</b>${compte(iv)?`<small>${compte(iv)}</small>`:""}</dd>
          <dt>Format</dt><dd><b>${esc(iv.format)}</b><small>${esc(iv.lieu)}</small></dd>
          <dt>Poste</dt><dd>${esc(iv.poste)}</dd>
        </dl></div>
      <p>${esc(iv.resume)}</p>
      <h3>Qui tu as en face</h3>
      ${iv.gens.map(g=>`<div class="box"><div><b>${esc(g[0])}</b><br><span style="color:var(--c);font-size:14.5px;font-weight:600">${esc(g[1])}</span></div><p style="color:var(--muted);font-size:15.5px">${g[2]}</p></div>`).join("")}`,
    boite: () => `${iv.figs?`<div class="figs">${iv.figs.map(f=>`<div><b>${f[0]}</b><small>${f[1]}</small></div>`).join("")}</div>`:""}
      <ul>${iv.boite.map(x=>`<li>${x}</li>`).join("")}</ul>`,
    angles: () => `<ul>${iv.angles.map(x=>`<li>${x}</li>`).join("")}</ul>`,
    pitch: () => pitch(iv),
    qa: () => `<div class="qa">${iv.qa.map(x=>`<div><p class="q">${esc(x[0])}</p><p class="a">${x[1]}</p></div>`).join("")}</div>`,
    poser: () => `<p>Quelques-unes suffisent. Elles doivent prouver que tu as compris le dossier.</p><ul>${iv.poser.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`,
    pieges: () => `<div class="box trap">${iv.pieges.map(x=>`<div>${x}</div>`).join("")}</div>`,
    quiz: () => quiz(iv)
  };
  return P[onglet]();
}

function pitch(iv){
  const l = S.lang || "fr";
  const beats = SOCLE[l].concat([
    {t: l==="fr" ? "Trajectoire" : "Trajectory", s:"1:10", p: iv.traj[l] || iv.traj.fr},
    {t: l==="fr" ? "Demande" : "Ask", s:"1:50", p: l==="fr"
      ? ["« Je cherche un stage à partir de <span class='fill'>[ta date de début]</span>, et ce que je viens y apprendre, c'est l'exécution. Voilà pour l'essentiel — je suis à votre disposition pour entrer dans le détail. »"]
      : ["“I'm looking for an internship starting <span class='fill'>[your start date]</span>, and what I want to learn is execution. That's the short version; happy to go deeper wherever it's useful.”"]}
  ]);
  return `<div class="key"><span class="lab">La structure</span>
      <b>Ancrage → Preuve → Trajectoire → Demande.</b> D'où je viens · ce que j'ai déjà fait · pourquoi vous précisément · ce que je viens chercher.</div>
    <div class="langs">
      <button aria-pressed="${l==='fr'}" onclick="lang('fr')">FRANÇAIS</button>
      <button aria-pressed="${l==='en'}" onclick="lang('en')">ENGLISH</button>
    </div>
    <div class="box">${beats.map(b=>`<div class="beat"><div class="mk"><b>${b.t}</b><span>${b.s}</span></div>
      <div>${b.p.map(x=>`<p>${x}</p>`).join("")}</div></div>`).join("")}</div>
    <p style="color:var(--muted);font-size:15px"><i>Répète-la à voix haute deux fois. Lue dans la tête, elle ne tient pas en bouche.</i></p>`;
}
function lang(l){ S.lang = l; save(); render(); }

function quiz(iv){
  const r = (S.quiz[iv.id] && S.quiz[iv.id].rep) || {};
  const faits = Object.keys(r).length;
  const bons = Object.keys(r).filter(i => r[i] === iv.quiz[i][2]).length;
  return `<div class="score"><b>${bons}/${iv.quiz.length}</b>
      <div><small>${faits ? faits+" question"+(faits>1?"s":"")+" répondue"+(faits>1?"s":"") : "Pas encore commencé"}</small>
      <small>${bons === iv.quiz.length ? "Tu connais le dossier." : "Réponds, la correction s'affiche aussitôt."}</small></div>
      ${faits ? `<button class="reset" onclick="razQuiz('${iv.id}')">Recommencer</button>` : ""}</div>
    <div class="qz">${iv.quiz.map((q,i)=>{
      const rep = r[i];
      return `<div class="qblock"><div class="num">Question ${i+1}</div><div class="txt">${esc(q[0])}</div>
        <div class="opts">${q[1].map((o,j)=>{
          let cls = "";
          if(rep !== undefined) cls = j === q[2] ? " good" : (j === rep ? " bad" : "");
          return `<button class="opt${cls}" ${rep!==undefined?"disabled":""} onclick="rep('${iv.id}',${i},${j})">${esc(o)}</button>`;
        }).join("")}</div>
        ${rep !== undefined ? `<p class="why">${esc(q[3])}</p>` : ""}</div>`;
    }).join("")}</div>`;
}
function rep(id, i, j){
  const iv = DATA.find(x=>x.id===id);
  if(!S.quiz[id]) S.quiz[id] = {rep:{}, bon:0, total:iv.quiz.length};
  S.quiz[id].rep[i] = j;
  S.quiz[id].bon = Object.keys(S.quiz[id].rep).filter(k => S.quiz[id].rep[k] === iv.quiz[k][2]).length;
  save(); render();
}
function razQuiz(id){ delete S.quiz[id]; save(); render(); }

function profil(){
  return `<header class="top">
      <div class="grow"><p class="eyebrow">Ce que tu peux dire de toi</p><h1>Mon profil</h1></div>
      <button class="tgl" onclick="theme()" aria-label="Changer de thème">◐</button>
    </header>
    <div class="box"><b>${MOI.nom}</b><small style="color:var(--muted)">${MOI.tel} · ${MOI.mail}</small></div>
    <h2>Formation</h2>
    <div class="box cv">${MOI.formation.map(r=>`<div class="row"><span class="yr">${r[0]}</span><div><b>${r[1]}</b><small>${r[2]}</small></div></div>`).join("")}</div>
    <h2>Expérience</h2>
    <div class="box cv">${MOI.exp.map(r=>`<div class="row"><span class="yr">${r[0]}</span><div><b>${r[1]}</b><small>${r[2]}</small></div></div>`).join("")}</div>
    <h2>Le reste</h2>
    <div class="box"><ul>${MOI.autres.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <h2>Vocabulaire anglais</h2>
    <div class="box"><table class="gloss">
      <tr><td>épargne réglementée</td><td>regulated savings</td></tr>
      <tr><td>garantie d'emprunt</td><td>loan guarantee</td></tr>
      <tr><td>audit interne, mission d'audit</td><td>internal audit, audit engagement</td></tr>
      <tr><td>risque de continuité d'activité</td><td>business continuity risk</td></tr>
      <tr><td>contrôle de gestion</td><td>financial planning &amp; analysis</td></tr>
      <tr><td>produit net bancaire</td><td>net banking income</td></tr>
      <tr><td>rachat, opération finalisée</td><td>acquisition, deal completed</td></tr>
      <tr><td>intégration post-acquisition</td><td>post-merger integration</td></tr>
      <tr><td>sous-traitant de rang 1</td><td>tier-one supplier</td></tr>
      <tr><td>stage, stagiaire</td><td>internship, intern</td></tr>
    </table></div>
    <footer>Tiré de ton CV. Si tu le mets à jour, pense à corriger cette page.</footer>`;
}

/* ── démarrage ──────────────────────────────────────────────────── */
try{ const t = localStorage.getItem("entretiens:theme"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
render();
setInterval(() => { if(vue === "accueil") render(); }, 60000);
if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
